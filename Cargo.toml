[package]
name = "shellwise"
version = "0.1.0"
edition = "2024"
description = "Command guard and lint for shell commands written by AI coding agents"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[features]
# Tests that compare the parsers against the real shells (need pwsh and Git Bash).
oracle = []
# Test-only rules that panic or sleep, driven by SHELLWISE_TESTHOOK. Never in a release build.
testhooks = []

[dependencies]
brush-parser = "0.4.0"
clap = { version = "4.6.8", features = ["derive"] }
globset = "0.4.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tree-sitter = "0.27.2"
tree-sitter-powershell = { version = "0.26.6", path = "vendor/tree-sitter-powershell" }

# A panic must unwind so the worker's catch_unwind can turn it into the fail-closed verdict.
[profile.release]
panic = "unwind"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
sha2 = "0.11.1"
syn = { version = "3.0.10", features = ["full", "visit"] }
