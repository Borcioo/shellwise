name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; the first cargo call installs it.
      - run: cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features testhooks -- -D warnings
      - run: shellcheck install.sh
        if: runner.os == 'Linux'
      - run: cargo test --no-fail-fast --features testhooks

  install-scripts:
    name: install scripts (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --features testhooks --test install_scripts --test update

  build:
    name: build (${{ matrix.target }})
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: shellwise.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: shellwise
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: shellwise
          # Cross-compiled on the Apple silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: shellwise
          # Static builds. Without CC_<target>, cc looks for aarch64-linux-musl-gcc on the ARM row.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: shellwise
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            bin: shellwise
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - name: Install the musl C toolchain
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          command -v musl-gcc aarch64-linux-musl-gcc x86_64-linux-musl-gcc shasum || true
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Show the binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          ls -l "$bin"
          if command -v file > /dev/null; then file "$bin"; fi
          # ldd exits 1 on a static binary ("not a dynamic executable").
          if [ "$RUNNER_OS" = Linux ]; then ldd "$bin" || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: shellwise-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
