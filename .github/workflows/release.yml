name: release

# A pushed tag `vX.Y.Z` on a commit of `main` builds the binaries and publishes a GitHub Release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main and matches Cargo.toml
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME"
          grep -q "^## \[$version\]" CHANGELOG.md

  build:
    needs: check
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled on the Apple silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
          # Static builds; the toolchain step points cc at musl-gcc for the C grammar.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - name: Install the musl C toolchain
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          command -v musl-gcc aarch64-linux-musl-gcc x86_64-linux-musl-gcc shasum || true
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo test --features testhooks
        if: runner.os != 'macOS' && !contains(matrix.target, 'musl')
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Each musl row's runner is native for its target, so the binary runs here.
      - name: Run the musl binary
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/shellwise"
          "$bin" --version
          proof="$RUNNER_TEMP/proof-bash.txt"
          printf '%s' "echo 'abc" > "$proof"
          code=0
          cat "$proof" | "$bin" check --shell bash || code=$?
          if [ "$code" -ne 1 ]; then
            echo "shellwise check exited $code on the proof command; expected 1" >&2
            exit 1
          fi
      - name: Package
        shell: bash
        run: |
          name="shellwise-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/shellwise.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/shellwise" "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shellwise-${{ matrix.target }}
          path: |
            shellwise-*.zip
            shellwise-*.tar.gz
            shellwise-*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the combined checksum file
        shell: bash
        run: |
          cp install.sh install.ps1 dist/
          cd dist && sha256sum shellwise-*.zip shellwise-*.tar.gz install.sh install.ps1 > SHA256SUMS
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
