# A command after `=` in an expression: the lexer reads the statement's mode only, so it takes the
# glued `@'` for a here-string where PowerShell reads a quote (a missed break, pinned).
[[row]]
id = "pwsh-missed-break-at-quote-glued-to-an-argument-of-an-assigned-command"
os = "any"
shell = "pwsh"
command = "$a = Write-Output $a=@'\nit's\n'@\ngit rev-parse v1.0.1^{commit}"
level = "warn"
rules = ["parse-error"]
oracle = "refuses"

