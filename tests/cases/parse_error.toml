[[row]]
id = "pwsh-other-kind-with-a-delete-is-danger"
os = "any"
shell = "pwsh"
command = "Get-Date ( ; rm -rf x"
level = "danger"
rules = ["parse-error-destructive"]
fix = "correct the syntax at column"
oracle = "refuses"

