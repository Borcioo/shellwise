# A backslash does not escape a double quote in PowerShell: an unclosed quote holding one is break,
# with the hint to double the quote. The shapes of corpus rows the host refused (the first three
# were labelled ok, their result being the host's parse error).
[[row]]
id = "pwsh-unclosed-quote-with-a-backslash-quote-is-break"
os = "any"
shell = "pwsh"
command = 'rg -n "\"x" notes.txt'
level = "break"
rules = ["parse-error"]
fix = """in PowerShell write a quote inside "…" as "" or use '…'"""
oracle = "refuses"

[[row]]
id = "pwsh-backslash-quote-a-json-key-pattern"
os = "any"
shell = "pwsh"
command = 'rg -n "\"e2e[^\"]*\":" package.json'
