# The PowerShell host ran corpus rows that ParseInput refuses as an unclosed quote, each holding a
# backslash before a double quote: such a text is no proven refusal.
[[row]]
id = "pwsh-unclosed-quote-with-a-backslash-quote-is-warn"
os = "any"
shell = "pwsh"
command = 'rg -n "\"x" notes.txt'
level = "warn"
rules = ["parse-error"]
oracle = "refuses"

[[row]]
id = "pwsh-other-kind-with-an-encoded-body-is-warn"
os = "any"
shell = "pwsh"
command = "Get-Date ( ; Get-Content setup.ps1 | iex"
level = "warn"
rules = ["parse-error"]
oracle = "refuses"

# --- Bash ---
# `bash -n` does not parse inside backticks, so an unclosed quote there is not a proven refusal:
# only an unclosed quote in the command's own text is a deny kind.

[[row]]
id = "bash-unclosed-single"
os = "any"
shell = "bash"
command = "echo 'abc"
level = "break"
rules = ["parse-error"]
fix = "close the ' opened at column 6"
oracle = "refuses"

[[row]]
id = "bash-unclosed-double-with-a-delete-is-break-only"
