# --- Bash runs the complete commands before an unclosed quote (Ruling 126) ---
# Execution oracle F:\Temp\shellwise-t34\W3\fix\oracle\ (marker files; Git Bash 5.2.37 and Linux
# bash 5.1.16; `bash -c`, `eval` and the Bash tool's wrapper all agree): each complete command
# before the line where the unclosed quote's command starts runs, so its findings stand at their
# own level next to the break. Nothing runs when the quote is on the first line, inside a
# construct still open (`if`), or on a line joined to the one before (`\`, `&&`, `|`).

