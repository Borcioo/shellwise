# The parse-error rules and their levels, through analyse. A deny kind (an unclosed quote) is
# break and the only finding; any other kind is warn, or danger from `parse-error-destructive`
# when the raw text holds a command of the destructive table. `oracle` says what the real shell's
# parser does with the text (pwsh ParseInput, bash -n); every break row must say "refuses".

# --- PowerShell ---

[[row]]
id = "pwsh-unclosed-double"
os = "any"
shell = "pwsh"
command = 'Write-Output "abc'
level = "break"
rules = ["parse-error"]
fix = 'close the " opened at column 14'
oracle = "refuses"

[[row]]
id = "pwsh-unclosed-single"
os = "any"
