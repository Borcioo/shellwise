# q34 (slice A, outside its slice; row only, at its current level): a heredoc whose body holds
# quote characters, inside a double-quoted `$( )`. `bash -n` accepts it; our parser reads it as
# a parse error that is no deny kind, so it is warn. The gap is in brush-parser 0.4.0: its word
# grammar scans the body of `$( )` as word pieces (`command_piece` in word.rs), so a `"` in a
# heredoc body opens a string that runs past the `)`. It fails unquoted too, and only with an
# unbalanced `"` (a lone `'` and a `"…"` pair parse). Fixing it means forking brush-parser, so the row stays at warn.
[[row]]
id = "q34-heredoc-with-quotes-in-a-quoted-substitution-is-warn"
os = "any"
shell = "bash"
command = "echo \"$(cat <<EOF\n'\"\nEOF\n)\""
level = "warn"
rules = ["parse-error"]
oracle = "accepts"

# B7: the unclosed-quote hint points at the quote that opened or closed the string, not at the
# first typographic quote or the first `\"` anywhere in the text.

# Typographic quotes paired with each other are harmless; the open quote is a plain `'`.
[[row]]
id = "pwsh-b7-paired-typographic-quotes-are-no-hint"
os = "any"
shell = "pwsh"
command = "Write-Output \u2018a\u2019; Write-Output 'b"
level = "break"
rules = ["parse-error"]
oracle = "refuses"
fix = "close the ' opened at column 32"

# A typographic `\u2019` closes the string a `'` opened: the hint names it.
[[row]]
id = "pwsh-b7-typographic-quote-that-closes-the-string"
os = "any"
shell = "pwsh"
command = "Write-Output 'it\u2019s done'"
level = "break"
rules = ["parse-error"]
oracle = "refuses"
fix = "replace the typographic quote at column 17 with ' or \""

# The unclosed string opens with a typographic quote.
[[row]]
id = "pwsh-b7-typographic-quote-that-opens-the-string"
os = "any"
shell = "pwsh"
command = "Write-Output 'a' \u201Cb"
level = "break"
rules = ["parse-error"]
oracle = "refuses"
fix = "replace the typographic quote at column 18 with ' or \""

# A `\"` inside single quotes closes nothing.
[[row]]
id = "pwsh-b7-backslash-quote-inside-single-quotes-is-no-hint"
os = "any"
shell = "pwsh"
command = "Write-Output 'a\\\"b'; Write-Output \"c"
level = "break"
rules = ["parse-error"]
oracle = "refuses"
fix = "close the \" opened at column 35"

# The `\"` that closes the string is named.
[[row]]
id = "pwsh-b7-backslash-quote-that-closes-the-string"
os = "any"
shell = "pwsh"
command = "rg -n \"\\\"x\" notes.txt"
level = "break"
rules = ["parse-error"]
oracle = "refuses"
fix = "the \\\" at column 8 closes the string: in PowerShell write a quote inside \"…\" as \"\" or use '…'"

# A `\""` keeps the string open: PowerShell reads `""` as one quote.
[[row]]
id = "pwsh-b7-backslash-quote-then-a-quote-keeps-the-string-open"
os = "any"
shell = "pwsh"
command = 'rg -n "id: \"" src'
level = "break"
rules = ["parse-error"]
oracle = "refuses"
fix = """the \\" at column 12 and the quote after it write one quote and leave the string open: in PowerShell write a quote inside "…" as "" or use '…'"""

# The live false warn of R1: in a command argument, a method call followed by an index or a member
# (`$(…).Split(' ')[0]`, `$a.Split(1).Length`) is valid PowerShell (`ParseInput`: 0 errors) but the
# vendored tree-sitter grammar does not read the postfix after the call's `)`. The fix is a grammar
# change in vendor/tree-sitter-powershell (grammar.js and the generated parser), not local, so the
# rows stay at warn. `(…)` around the argument parses.
[[row]]
id = "pwsh-gap-method-call-then-index-in-an-argument-is-warn"
os = "any"
shell = "pwsh"
command = "git log -1 $(git blame -L x --porcelain a -- b | Select-Object -First 1).Split(' ')[0]"
level = "warn"
rules = ["parse-error"]
oracle = "accepts"

[[row]]
id = "pwsh-gap-method-call-then-member-in-an-argument-is-warn"
os = "any"
