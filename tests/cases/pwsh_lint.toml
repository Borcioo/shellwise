# The PowerShell lint rules (src/rules/pwsh_lint/), through analyse. Every rule has a row where
# it fires and an allow twin where it does not. Break rows hold the expected Fix text; warn rows
# are context only. `oracle` is what pwsh 7.7's ParseInput does with the text.
#
# Ported rows: the baseline-guard rows of tests/test_rules.py for the nine installed PowerShell rules
# and ps-unix-command (deny rows per rule there: bat-metachar 16, cli-inline-prose 11,
# gate-truncated-pipeline 17, ps-bad-parameter 9, ps-bare-bash 12, ps-dotnet-relative-path 18,
# ps-git-commit-stdin 4, ps-native-nonewline 7, ps-unix-command 4, stale-write-var 51). Rows that
# build their command at run time (a Herd path, a defined test variable, a junction) or that need
# a configured gate command are not portable here and are left out; the rest keep baseline-guard's
# text where it is synthetic. Quote and backtick characters outside ASCII are written as \u
# escapes.

# --- bat-metachar (break, Windows): cmd.exe re-parses a .bat launcher's arguments ---

[[row]]
id = "bat-pipe-in-a-vendor-bin-filter"
os = "windows"
shell = "pwsh"
command = "vendor\\bin\\phpunit --filter 'A|B'"
level = "break"
rules = ["bat-metachar"]
fix = "vendor\\bin\\phpunit --% --filter \"A|B\""
oracle = "accepts"

[[row]]
id = "bat-caret-in-a-composer-constraint"
os = "windows"
shell = "pwsh"
command = "tools\\composer.bat require 'wordpress/mcp-adapter:^0.5'"
level = "break"
rules = ["bat-metachar"]
fix = "--% require \"wordpress/mcp-adapter:^0.5\""
oracle = "accepts"

[[row]]
id = "bat-ampersand-in-an-explicit-bat"
os = "windows"
shell = "pwsh"
command = ".\\tools\\sshmux.bat exec dev 'uptime&&df'"
level = "break"
rules = ["bat-metachar"]
fix = "--% exec dev \"uptime&&df\""
oracle = "accepts"

[[row]]
id = "bat-pipe-inside-inner-quotes-of-a-wrapped-value"
os = "windows"
shell = "pwsh"
command = "tools\\wp.bat db query 'SELECT \"a|b\" FROM t'"
level = "break"
rules = ["bat-metachar"]
fix = "starts by its own path"
oracle = "accepts"

[[row]]
id = "bat-defined-percent-variable"
os = "windows"
shell = "pwsh"
command = "tools\\wp.bat option get %PATH%"
level = "break"
rules = ["bat-metachar"]
fix = "starts by its own path"
oracle = "accepts"

[[row]]
id = "bat-allow-a-value-powershell-quotes"
os = "windows"
shell = "pwsh"
command = "vendor\\bin\\phpunit --filter 'A B|C'"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "bat-allow-the-exe-by-its-path"
os = "windows"
shell = "pwsh"
command = "& 'X:\\tools\\php84\\php.exe' vendor/bin/phpunit --filter 'A|B'"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "bat-allow-a-native-program"
os = "windows"
shell = "pwsh"
command = "rg -n 'tail|head' ."
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "bat-allow-an-undefined-percent-name"
