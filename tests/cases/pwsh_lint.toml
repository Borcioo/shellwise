# --- gate-truncated-pipeline (break): a tee'd run piped into a truncator ---

[[row]]
id = "gate-tee-then-select-first"
os = "any"
shell = "pwsh"
command = "npm test 2>&1 | Tee-Object run.log | Select-Object -First 30"
level = "warn"
rules = ["gate-truncated-pipeline"]
fix = "$out = npm test 2>&1 | Tee-Object run.log 2>&1; $out | Select-Object -Last 20"
oracle = "accepts"

# Known gap (Task 27): the parser does not model an attached number (`-First:30`), so the rules see
# no script and only the parser's warn fires. When it does, this row becomes the break above.
[[row]]
id = "gate-tee-then-select-first-attached"
os = "any"
shell = "pwsh"
command = "npm test 2>&1 | Tee-Object run.log | Select-Object -First:30"
level = "warn"
rules = ["parse-error"]
oracle = "accepts"

[[row]]
id = "gate-tee-then-select-f-prefix"
os = "any"
shell = "pwsh"
command = "npm test 2>&1 | Tee-Object run.log | Select-Object -f 30"
level = "warn"
rules = ["gate-truncated-pipeline"]
fix = "$out = npm test"
oracle = "accepts"

[[row]]
id = "gate-tee-then-head-is-also-a-unix-tool"
os = "any"
shell = "pwsh"
command = "npm test 2>&1 | Tee-Object run.log | head -40"
level = "warn"
rules = ["gate-truncated-pipeline", "ps-unix-command"]
fix = "$out = npm test"
oracle = "accepts"

[[row]]
id = "gate-tee-behind-a-foreach"
os = "any"
shell = "pwsh"
command = "npm test 2>&1 | Tee-Object run.log | ForEach-Object { $_ } | Select-Object -First 5"
level = "warn"
rules = ["gate-truncated-pipeline"]
fix = "$out = npm test"
oracle = "accepts"

[[row]]
id = "gate-allow-select-last"
os = "any"
shell = "pwsh"
command = "npm test 2>&1 | Tee-Object run.log | Select-Object -Last 20"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "gate-allow-first-without-a-gate-or-tee"
os = "any"
shell = "pwsh"
command = "Get-Content notes.txt | Select-Object -First 5"
level = "ok"
rules = []
oracle = "accepts"

# --- ps-bad-parameter (break): the cmdlet refuses the parameter ---

[[row]]
