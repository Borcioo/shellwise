# `-A 1` alone: `-A` binds -AllMatches and `1` becomes the pattern, so the call runs (probed).
[[row]]
id = "bad-param-allow-a-hinted-number-that-takes-the-first-position"
os = "any"
shell = "pwsh"
command = "Select-String -A 1 -Path notes.txt"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "bad-param-a-hinted-number-after-a-file"
os = "any"
shell = "pwsh"
command = "Select-String b -A 1 notes.txt"
level = "break"
rules = ["ps-bad-parameter"]
fix = "use -Context 0,1: Select-String b -Context 0,1 notes.txt"
oracle = "accepts"

# A value parameter takes the next dash token as its value unless the token names a static
# parameter (probed in pwsh 7.7: `-l -a` and `-l -File` list a path named so, `-Pattern -NoProfile`
# searches for the text; `-l -Force` and `-Pattern -Quiet` are "Missing an argument").
[[row]]
id = "bad-param-allow-a-dash-value-that-names-no-parameter"
os = "any"
shell = "pwsh"
command = "Select-String -Path notes.txt -Pattern -NoProfile"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "bad-param-allow-a-dynamic-name-as-a-value"
os = "any"
shell = "pwsh"
command = "Get-ChildItem -l -File"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "bad-param-an-ambiguous-name-after-a-value-parameter"
