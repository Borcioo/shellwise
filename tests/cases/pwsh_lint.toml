# --- cli-inline-prose (break): a typographic quote tears the string ---

[[row]]
id = "prose-body-low-double-quote"
os = "any"
shell = "pwsh"
command = "gh pr create --base develop --title 'chore: x' --body \"Zmiana \u201Ex\u201D gotowa\""
level = "break"
rules = ["cli-inline-prose"]
fix = "quote the --body text with '...' instead, or write the text with the Write tool and pass --body-file <file>"
oracle = "accepts"

[[row]]
id = "prose-release-notes-short-flag"
os = "any"
shell = "pwsh"
command = "gh release create v1.2.0 -n \"Fix \u201Ethe\u201D thing\""
level = "break"
rules = ["cli-inline-prose"]
fix = "--notes-file <file>"
oracle = "accepts"

[[row]]
id = "prose-title-single-family"
os = "any"
shell = "pwsh"
command = "gh pr create --title 'Fix \u2018x\u2019 now' --body-file b.txt"
level = "break"
rules = ["cli-inline-prose"]
fix = "quote the --title text with \"...\""
oracle = "accepts"

# Known gap (Task 27): the parser does not model a typographic quote inside an attached `--body=` value,
# so only the parser's warn fires. When it does, this row becomes a cli-inline-prose break.
[[row]]
id = "prose-attached-body"
os = "any"
shell = "pwsh"
command = "gh pr create --title 'fix: x' --body=\"Fix \u201Ethe\u201D thing\""
level = "warn"
rules = ["parse-error"]
oracle = "accepts"

[[row]]
id = "prose-allow-the-other-family"
os = "any"
shell = "pwsh"
command = "gh pr create --title x --body 'Zmiana \u201Ex\u201D gotowa'"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
