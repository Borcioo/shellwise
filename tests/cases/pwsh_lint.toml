command = "Select-String -Path notes.txt -Pattern -i"
level = "break"
rules = ["ps-bad-parameter"]
fix = "give -pattern a value or remove it: Select-String -Path notes.txt -i"
oracle = "accepts"

# `-Name:` and a space: the next word is the value, for a switch too (probed: both run). Known gap
# (Task 27): the parser does not model the shape yet, so only its warn fires; the binder already
# takes the next word, and these rows become ok once the parser reads it.
[[row]]
id = "bad-param-allow-a-colon-then-a-space"
os = "any"
shell = "pwsh"
command = "Get-Content notes.txt | Select-Object -First: 2"
level = "warn"
rules = ["parse-error"]
oracle = "accepts"

