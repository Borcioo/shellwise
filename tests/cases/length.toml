# The Git Bash length rule `too-long`, through analyse. Git Bash cuts a command whose escaped
# length (each single quote counted as four characters) reaches 7790 and runs the part before
# the cut, so the rule is break at 7790 and ok at 7789. Rows are generated: `echo` and a run of
# `a`, with empty quote pairs where a row needs the escape to count.

[[row]]
id = "gitbash-escaped-7789-is-ok"
os = "windows"
shell = "gitbash"
command = "echo "
level = "ok"
rules = []

[[row]]
id = "gitbash-escaped-7790-is-break"
os = "windows"
shell = "gitbash"
command = "echo "
level = "break"
rules = ["too-long"]
fix = "run shellwise lint"

# Raw length 7489, escaped 7789: a rule that counts raw characters passes both quote rows.
[[row]]
id = "gitbash-escaped-7789-with-quotes-is-ok"
os = "windows"
shell = "gitbash"
command = "echo ''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''"
level = "ok"
rules = []

# Raw length 7490, escaped 7790: only the escape measure puts this over.
[[row]]
id = "gitbash-escaped-7790-with-quotes-is-break"
os = "windows"
shell = "gitbash"
command = "echo ''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''"
level = "break"
rules = ["too-long"]
fix = "run shellwise lint"

[[row]]
id = "gitbash-short-is-ok"
os = "windows"
shell = "gitbash"
command = "echo hi"
level = "ok"
rules = []

# The limit is Git Bash's launcher; POSIX Bash has none.
[[row]]
id = "posix-bash-over-the-limit-stays-ok"
os = "posix"
shell = "bash"
command = "echo "
level = "ok"
rules = []

# PowerShell commands reach 26 000 characters with no length failure.
[[row]]
id = "pwsh-over-the-limit-stays-ok"
os = "any"
shell = "pwsh"
command = "Write-Output "
level = "ok"
rules = []

# Over MAX_INPUT_BYTES: the length rule runs before the size cap, so it still fires; the analysis is incomplete (warn).
[[row]]
id = "gitbash-70-kb-is-too-long-and-incomplete"
os = "windows"
shell = "gitbash"
command = "echo "
level = "break"
rules = ["too-long", "analysis-incomplete"]
fix = "run shellwise lint"
