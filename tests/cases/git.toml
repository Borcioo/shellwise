# ---------------------------------------------------------------- git rm on the whole folder
# `git rm -r` on a pathspec of the whole folder git runs in (`.`, `./`, a `*` the shell expands)
# or of the repository (`:/`, `:/.`, `:(top)`, a path that is the repo root) removes every tracked
# file there from the working tree: with `-f`/`--force` it also throws away their uncommitted
# changes (danger); without it git refuses a file with changes and the rest is restorable (warn).
# A `*` git expands itself (`'*'` in Bash, any `*` in PowerShell, `:/*`) reaches nested files
# without `-r` (probed on git 2.53). `--cached` and `-n`/`--dry-run` (before `--` or
# `--end-of-options`, the last of `--cached`/`--no-cached` and `--dry-run`/`--no-dry-run` wins)
# leave the files: ok; only a literal word sets them. git rejects `-R` (exit 129). `-C <dir>`
# makes `.` that folder: still its whole contents. A narrow wildcard (`'*.log'`) keeps its verdict.

[[row]]
id = "rm-rf-dot"
os = "any"
shell = "pwsh"
command = "git rm -rf ."
level = "danger"
rules = ["git-discard"]
fix = "git rm -r --cached ."

