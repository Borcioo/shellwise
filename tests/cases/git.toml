# The git rules, through analyse, against the fixture tree `tests/delete.rs` builds (FX_ names
# as in delete.toml; FX_REPO also holds `wt/` with a junction or symlink `wt/node_modules` to
# FX_OUTSIDE/target, and a plain `wt-clean/`). Path-free pwsh rows run on every OS. The runner
# enables `policies.git_no_verify` except on rows whose id starts with `policy-off-`; `nocwd-`
# rows run with no cwd.
#
# Rows ported from the baseline guard's tests/test_rules.py carry an id starting with `sg-` (or
# `nocwd-sg-`); `tests/delete.rs` checks their count per rule against PORTED. Ported, and the
# baseline guard lines that name the rule (approximate: counted with grep, so comment lines are in
# and allow twins with no rule name are out):
#   git-restore-discards  12 ported (7 deny, 5 allow) of about 19 lines; the rest are the same
#                         shapes behind a cwd the hook could not follow.
#   git-no-verify         24 ported (13 deny, 11 allow) of about 218 lines; dropped: prefix
#                         abbreviations (`--no-veri`), quoting and escapes inside a config key,
#                         GIT_CONFIG_* environment tricks, backtick bodies: obfuscation-only
#                         shapes (Ruling 91).
#   git-unreadable         6 ported (5 deny, 1 allow) of about 27 lines; dropped: `env -S`/
#                         `env --chdir` bodies, splats and arrays that carry the subcommand
#                         (obfuscation; an unread wrapper with a delete is opaque-destructive).
#   git-worktree-junction  rebuilt on this fixture (the baseline guard builds its own repo with real
#                         worktrees; the suffix lookup through `git worktree list` is not ported,
#                         so a bare name that is no folder here is a finding).
# Corpus counts of the shapes (2026-11-19): `git worktree remove` 320, `git checkout --` 73,
# `git restore` 41, `git commit --no-verify` 26, `git clean -f` 5, `git reset --hard` 3,
# `git stash drop|clear` 2.

