# inline-script-too-long and the cmd.exe branch of too-long, through analyse.
#
# inline-script-too-long: a row at the line threshold of its shell (pwsh 80 lines, bash 100) is ok
# and the row one line over is break, with the Fix line that routes the text to a linted file. The
# character thresholds (pwsh 6,000, bash 8,000) are generated in tests/lint_file.rs.
#
# too-long, cmd.exe (Windows, pwsh): pwsh starts cmd with "C:\WINDOWS\system32\cmd.exe" (29
# characters) in place of the typed word, and cmd refuses a line over 8191. Measured with pwsh 7.7:
# a typed `cmd /c echo a...` of 8165 characters runs and one of 8166 prints "The command line is too
# long."; `cmd.exe /c echo a...` runs at 8169 and is refused at 8170; `& cmd /c echo a...` runs at
# 8167 and is refused at 8168; `& "cmd.exe" /c echo a...` runs at 8173 and is refused at 8174.
# Below the limit the text is still over 6,000 characters, so the
# inline rule is the twin's only finding.
# Rows are generated (F:/Temp/shellwise-t31/gen_inline_rows.py).

[[row]]
id = "pwsh-80-lines-is-ok"
os = "any"
shell = "pwsh"
command = "Get-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date\nGet-Date"
