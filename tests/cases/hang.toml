# --- PowerShell ---

[[row]]
id = "wl-ps-while-not-test-path"
os = "any"
shell = "pwsh"
command = "while (-not (Test-Path done.txt)) { Start-Sleep 5 }"
level = "break"
rules = ["wait-loop-unbounded"]
fix = "for ($i = 0; $i -lt 120; $i++) { if (-not (-not (Test-Path done.txt))) { break }; Start-Sleep 5 }; if ($i -eq 120) { throw 'the wait timed out' }  # when you wait for a process, wait on the process (Wait-Process -Id <pid> -Timeout <seconds>) rather than on a line in its log"

[[row]]
