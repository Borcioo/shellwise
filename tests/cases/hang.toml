command = 'while IFS= read -r line || [ -n "$line" ]; do echo "$line"; sleep 1; done < file.txt'
level = "ok"
rules = []

# `until read` and `while ! read` loop while the read fails (a file that is not there yet): they
# wait, as any polling loop does.
[[row]]
id = "wl-bash-until-read-is-a-wait-loop"
os = "any"
shell = "bash"
command = "until read -r pid < server.pid 2>/dev/null; do sleep 1; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 600); do read -r pid < server.pid 2>/dev/null && break; sleep 1; [ "$i" -lt 600 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-bash-while-not-read-is-a-wait-loop"
os = "any"
shell = "bash"
command = "while ! read -r line < ready.fifo; do sleep 1; done"
level = "break"
rules = ["wait-loop-unbounded"]

# Deny twins: a `read` in the body is no reader condition. The `read -t` row is a known false
# deny kept at break for a ruling: Ruling 134 names only a `read` without `-t`, though `while read
# -t 5` also ends by its own timeout.
[[row]]
id = "wl-bash-read-in-the-body-with-sleep"
os = "any"
shell = "bash"
command = 'while [ -n "$x" ]; do read -r x; sleep 1; done < list.txt'
level = "break"
rules = ["wait-loop-unbounded"]

[[row]]
id = "wl-bash-read-with-timeout-condition-and-sleep"
os = "any"
shell = "bash"
command = 'while read -t 5 line; do echo "$line"; sleep 1; done'
level = "break"
rules = ["wait-loop-unbounded"]

# A follow feeding the reader is follow-unbounded's business (Ruling 134).
[[row]]
id = "wl-bash-follow-into-while-read-with-sleep"
os = "any"
shell = "bash"
command = 'tail -f app.log | while read line; do echo "$line"; sleep 1; done'
