# The will-hang rule through analyse: commands that wait for input nobody can give in the hook's
# tool, and (ps-alias-shadow) a PowerShell function a built-in alias outranks. Every row goes through the real
# parsers; the program table (`data/programs.toml`) carries the facts.
#
# Spike S3 (Ruling 110): the Bash tool's stdin is an open pipe that never ends, so a Bash `read`
# with nothing to read waits; PowerShell's `Read-Host` fails at once, and no ssh wait was shown.
# Those two are no findings here. Every `read` row's wait or return was probed in Git Bash 5.2
# with stdin an open empty pipe under a 2 s timer.
#
# Row shapes are synthetic.

# --- Bash: read with nothing to read (probed: waits) ---

[[row]]
id = "bash-read-bare"
os = "any"
shell = "bash"
command = 'read x'
level = "break"
rules = ["will-hang"]
fix = 'feed read its input'

[[row]]
id = "bash-read-prompt-option"
os = "any"
shell = "bash"
command = 'read -r -p "Continue? " answer'
level = "break"
rules = ["will-hang"]
fix = 'feed read its input'

# The Fix keeps the command as typed and feeds it on the same line; it names no variable.
[[row]]
id = "bash-read-fix-feeds-the-command-as-typed"
os = "any"
shell = "bash"
command = 'read -r name'
level = "break"
rules = ["will-hang"]
fix = 'feed read its input on the same line: append <<< "<value>" to the read command'

[[row]]
id = "bash-read-prompt-value-looks-like-an-option"
os = "any"
shell = "bash"
command = 'read -rp -t x'
