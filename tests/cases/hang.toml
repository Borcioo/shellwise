# --- D9: rows only, at their current level (low plausibility, left as they are) ---
# Bash bounds a read under TMOUT (exit 142 after the timeout), `env read` fails at once (127: env
# runs no builtin), and an earlier `exec < file` feeds the read (a documented limit): each reads
# as `break` today, a false deny the rule keeps.

[[row]]
id = "d9-read-under-tmout-prefix"
os = "any"
shell = "bash"
command = 'TMOUT=5 read x'
level = "break"
rules = ["will-hang"]

[[row]]
id = "d9-read-after-export-tmout"
os = "any"
shell = "bash"
command = 'export TMOUT=5; read x'
level = "break"
rules = ["will-hang"]

[[row]]
id = "d9-env-read"
os = "any"
shell = "bash"
command = 'env read x'
level = "break"
rules = ["will-hang"]

[[row]]
id = "d9-read-after-exec-redirect"
os = "any"
shell = "bash"
command = 'exec < input.txt; read x'
level = "break"
rules = ["will-hang"]

# D09 (surviving mutant): a dynamic argument might hold the bound (Ruling 91a), so the read is
# not judged. A bare `read` with a non-literal word is already opaque in the Bash lowering (a name
# writer); behind a wrapper the lowering does not see the builtin, and this check is what holds.
[[row]]
id = "d09-wrapped-read-with-a-dynamic-option-is-not-judged"
os = "any"
shell = "bash"
command = 'env read $opts x'
level = "ok"
rules = []