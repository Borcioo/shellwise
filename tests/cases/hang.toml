# --- A bound in the header ends the loop only where reaching it ends the loop (Ruling 141) ---
# `until C` ends when C holds: a bound joined by `||` does it, one joined by `&&` waits for the
# other side too; `while C` the other way round.

[[row]]
id = "wl-bash-until-a-and-bound-is-unbounded"
os = "any"
shell = "bash"
command = "n=0; until grep -q ok log && [ $n -ge 1 ]; do n=$((n+1)); sleep 5; done"
level = "break"
rules = ["wait-loop-unbounded"]

[[row]]
id = "wl-bash-until-a-or-bound-is-bounded"
os = "any"
shell = "bash"
command = "n=0; until grep -q ok log || [ $n -ge 60 ]; do n=$((n+1)); sleep 5; done"
level = "ok"
rules = []

[[row]]
id = "wl-bash-while-a-and-bound-is-bounded"
os = "any"
shell = "bash"
command = "n=0; while ! grep -q ok log && [ $n -lt 60 ]; do n=$((n+1)); sleep 5; done"
level = "ok"
rules = []

[[row]]
