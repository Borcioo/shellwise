# The will-hang rule through analyse: commands that wait for input nobody can give in the hook's
# tool, and a PowerShell function a built-in alias outranks. Every row goes through the real
# parsers. Levels follow the landing rule: `read` is break (no corpus match was counted for it);
# ssh, `claude -p` and the alias helper are warn (109, 70 and 6 `ok` corpus rows match their
# draft shapes, over the 5-row limit for break).
#
# Rows whose id starts with `s3-` depend on spike S3 (does the tool wait on a prompt?). If S3
# shows a fast failure for the candidate, delete its rows and its data/programs.toml row.
#
# Row shapes are synthetic; the program table (`data/programs.toml`) carries the facts.

# --- Bash: read with nothing to read ---

[[row]]
id = "bash-read-bare"
os = "any"
shell = "bash"
command = 'read x'
level = "break"
rules = ["will-hang"]
fix = 'feed read its input'

[[row]]
id = "bash-read-prompt-option"
os = "any"
shell = "bash"
command = 'read -r -p "Continue? " answer'
level = "break"
rules = ["will-hang"]
fix = 'feed read its input'

[[row]]
id = "gitbash-read-bare"
os = "windows"
shell = "gitbash"
command = 'echo start; read x'
level = "break"
rules = ["will-hang"]
fix = 'feed read its input'

[[row]]
id = "bash-read-first-in-a-pipeline"
