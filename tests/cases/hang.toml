# --- The Fix line (Ruling 136): a counted loop that runs the condition's own text first, `C ||
# break` for `while C`, `C && break` for `until C`, and fails when its rounds run out (Bash: the
# body's last command `[ "$i" -lt N ]`; PowerShell: `throw`), so `&& next` does not run after a
# timeout. Each Fix shape was pasted into Git Bash 5.2 and pwsh 7.7 (condition met at once, never
# met, followed by a next command).

# A compound condition is kept whole, its first `!` included.
[[row]]
id = "wl-bash-fix-keeps-a-compound-negated-condition"
os = "any"
shell = "bash"
command = "while ! grep -q a log && ! grep -q b log; do sleep 5; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 120); do ! grep -q a log && ! grep -q b log || break; sleep 5; [ "$i" -lt 120 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-bash-fix-keeps-a-compound-until-condition"
os = "any"
shell = "bash"
command = "until [ -f a ] && [ -f b ]; do sleep 5; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 120); do [ -f a ] && [ -f b ] && break; sleep 5; [ "$i" -lt 120 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

# A subshell or a brace group around the condition stays, its `!` too.
[[row]]
id = "wl-bash-fix-keeps-a-negated-subshell-condition"
os = "any"
shell = "bash"
command = "while ! ( grep -q a log && grep -q b log ); do sleep 5; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 120); do ! ( grep -q a log && grep -q b log ) || break; sleep 5; [ "$i" -lt 120 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-bash-fix-keeps-a-brace-group-condition"
os = "any"
shell = "bash"
command = "until { grep -q a log; grep -q b log; }; do sleep 5; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 120); do { grep -q a log; grep -q b log; } && break; sleep 5; [ "$i" -lt 120 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

# `continue` would skip the round test: no command is built, a sentence is.
[[row]]
id = "wl-bash-fix-of-a-body-with-continue-is-a-sentence"
os = "any"
shell = "bash"
command = "until grep -q done log; do [ -f skip ] && continue; sleep 5; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = "rewrite the loop as a loop of at most 120 rounds that runs its condition first and breaks on it, and that fails when the rounds run out (no command is built: the body's `continue` would skip the round test); when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log"

# A condition of several commands is grouped: only its last one decides.
[[row]]
id = "wl-bash-fix-groups-a-condition-list"
os = "any"
shell = "bash"
command = "until touch probe; grep -q done log; do sleep 5; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 120); do { touch probe; grep -q done log; } && break; sleep 5; [ "$i" -lt 120 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-ps-fix-keeps-a-compound-condition"
os = "any"
shell = "pwsh"
command = "while (-not (Test-Path a) -and -not (Test-Path b)) { Start-Sleep 5 }"
level = "break"
rules = ["wait-loop-unbounded"]
fix = "for ($i = 0; $i -lt 120; $i++) { if (-not (-not (Test-Path a) -and -not (Test-Path b))) { break }; Start-Sleep 5 }; if ($i -eq 120) { throw 'the wait timed out' }  # when you wait for a process, wait on the process (Wait-Process -Id <pid> -Timeout <seconds>) rather than on a line in its log"

# A6: a timeout ends the fixed loop non-zero, so the command after `&&` does not run.
[[row]]
id = "wl-bash-fix-fails-before-a-next-command"
os = "any"
shell = "bash"
command = "until grep -q done log; do sleep 5; done && deploy.sh"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 120); do grep -q done log && break; sleep 5; [ "$i" -lt 120 ]; done && deploy.sh  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-ps-fix-throws-before-a-next-command"
os = "any"
shell = "pwsh"
command = "while (-not (Test-Path done.txt)) { Start-Sleep 5 }; Write-Host deployed"
level = "break"
rules = ["wait-loop-unbounded"]
fix = "for ($i = 0; $i -lt 120; $i++) { if (-not (-not (Test-Path done.txt))) { break }; Start-Sleep 5 }; if ($i -eq 120) { throw 'the wait timed out' }; Write-Host deployed  # when you wait for a process, wait on the process (Wait-Process -Id <pid> -Timeout <seconds>) rather than on a line in its log"

# A body that ends in a background command takes the round test after its `&`, not after `;`.
[[row]]
id = "wl-bash-fix-after-a-background-command"
os = "any"
shell = "bash"
command = "until grep -q done log; do sleep 5; ./ping.sh & done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 120); do grep -q done log && break; sleep 5; ./ping.sh & [ "$i" -lt 120 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

# A10: a tool call's shell never has the PID as a child, so the hint names no `wait <pid>`.
[[row]]
id = "wl-bash-fix-of-a-kill-0-wait"
os = "any"
shell = "bash"
command = "while kill -0 1234 2>/dev/null; do sleep 1; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 600); do kill -0 1234 2>/dev/null || break; sleep 1; [ "$i" -lt 600 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

# A11: the rounds come from the sleep's own unit.
[[row]]
id = "wl-bash-fix-reads-a-minute-sleep"
os = "any"
shell = "bash"
command = "until grep -q done log; do sleep 1m; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 10); do grep -q done log && break; sleep 1m; [ "$i" -lt 10 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-bash-fix-reads-a-two-minute-sleep"
os = "any"
shell = "bash"
command = "while true; do grep -q done log && break; sleep 2m; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 5); do grep -q done log && break; sleep 2m; [ "$i" -lt 5 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-bash-fix-reads-a-fraction-of-a-second"
