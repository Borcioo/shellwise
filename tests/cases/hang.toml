id = "wl-bash-while-read-with-sleep"
os = "any"
shell = "bash"
command = "while read -r host; do sleep 1; done < hosts.txt"
level = "ok"
rules = []

[[row]]
id = "wl-bash-piped-while-read-with-sleep"
