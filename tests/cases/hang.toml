[[row]]
id = "d09-wrapped-read-with-a-dynamic-option-is-not-judged"
os = "any"
shell = "bash"
command = 'env read $opts x'
level = "ok"
rules = []
# --- wait-loop-unbounded: a loop that waits and nothing bounds (owner decision, 2026-11-20) ---
# A loop that polls (its body waits) or whose condition is always true, with no counter, deadline
# or `timeout` that ends it, runs forever when what it waits for never comes. Shapes from
# `F:\Temp\shellwise-t34\waitloop\probes.txt` (lines 1-5) and synthetic twins. Command lines and
# script files alike.

[[row]]
id = "wl-bash-until-grep-log"
os = "any"
shell = "bash"
command = "until grep -q '^done' /tmp/x/run.log 2>/dev/null; do sleep 15; done; cat /tmp/x/summary.txt"
level = "break"
rules = ["wait-loop-unbounded"]
fix = '''for i in $(seq 1 40); do grep -q '^done' /tmp/x/run.log 2>/dev/null && break; sleep 15; [ "$i" -lt 40 ]; done; cat /tmp/x/summary.txt  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'''

[[row]]
id = "wl-bash-while-not-curl"
os = "any"
shell = "bash"
command = "while ! curl -sf http://localhost:3000/health; do sleep 2; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 300); do ! curl -sf http://localhost:3000/health || break; sleep 2; [ "$i" -lt 300 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-bash-while-true-sleep"
os = "any"
shell = "bash"
command = "while true; do sleep 5; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 120); do sleep 5; [ "$i" -lt 120 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-bash-while-colon-sleep"
os = "any"
shell = "bash"
command = "while :; do sleep 1; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 600); do sleep 1; [ "$i" -lt 600 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

# `while C` ends when C fails: the Fix breaks on `C || break`.
[[row]]
id = "wl-bash-while-file-exists"
os = "any"
shell = "bash"
command = "while [ -f build.lock ]; do sleep 1; done"
level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 600); do [ -f build.lock ] || break; sleep 1; [ "$i" -lt 600 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-bash-arith-for-open"
os = "any"
shell = "bash"
command = "for (( ; ; )); do sleep 1; done"
level = "break"
rules = ["wait-loop-unbounded"]

# Always true and no wait: a loop with no exit at all.
[[row]]
id = "wl-bash-while-true-no-wait"
os = "any"
shell = "bash"
command = "while true; do echo tick; done"
