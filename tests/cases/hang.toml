fix = 'for i in $(seq 1 1200); do grep -q done log && break; sleep 0.5s; [ "$i" -lt 1200 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-ps-fix-reads-a-thread-sleep"
os = "any"
shell = "pwsh"
command = "while (-not (Test-Path done.txt)) { [Threading.Thread]::Sleep(5000) }"
level = "break"
rules = ["wait-loop-unbounded"]
fix = "for ($i = 0; $i -lt 120; $i++) { if (-not (-not (Test-Path done.txt))) { break }; [Threading.Thread]::Sleep(5000) }; if ($i -eq 120) { throw 'the wait timed out' }  # when you wait for a process, wait on the process (Wait-Process -Id <pid> -Timeout <seconds>) rather than on a line in its log"

# A12: a loop over several lines gets the same shape with its own text.
[[row]]
id = "wl-bash-fix-of-a-multi-line-loop"
os = "any"
shell = "bash"
command = "until grep -q done log\ndo\n  echo waiting\n  sleep 5\ndone"
level = "break"
rules = ["wait-loop-unbounded"]
fix = "for i in $(seq 1 120); do\n  grep -q done log && break\n  echo waiting\n  sleep 5\n  [ \"$i\" -lt 120 ]\ndone  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log"

[[row]]
id = "wl-ps-fix-of-a-multi-line-loop"
os = "any"
shell = "pwsh"
command = "while (-not (Test-Path done.txt)) {\n  Write-Host waiting\n  Start-Sleep 5\n}"
level = "break"
rules = ["wait-loop-unbounded"]
fix = "for ($i = 0; $i -lt 120; $i++) {\n  if (-not (-not (Test-Path done.txt))) { break }\n  Write-Host waiting\n  Start-Sleep 5\n}\nif ($i -eq 120) { throw 'the wait timed out' }  # when you wait for a process, wait on the process (Wait-Process -Id <pid> -Timeout <seconds>) rather than on a line in its log"

# A here-document's text is not in the loop's statements: no command is built, a sentence is.
[[row]]
id = "wl-bash-fix-of-a-loop-with-a-heredoc-is-a-sentence"
os = "any"
shell = "bash"
command = "until grep -q done log\ndo\n  cat <<EOF\nwaiting\nEOF\n  sleep 5\ndone"
level = "break"
rules = ["wait-loop-unbounded"]
fix = "rewrite the loop as a loop of at most 120 rounds that runs its condition first and breaks on it, and that fails when the rounds run out (no command is built: the loop holds a here-document); when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log"
