# The PowerShell Fix runs the whole pipeline in a job bounded by `Wait-Job -Timeout`: a later
# stage stays (shown to end after 60 s on a quiet log in pwsh 7.7, relative path read, no process
# left). Ruling 143: the job starts in the caller's folder (Windows PowerShell 5.1 starts it in
# Documents) and reads the caller's variables through `$using:`.
[[row]]
id = "fu-ps-get-content-wait-into-select-string"
os = "any"
shell = "pwsh"
command = "Get-Content log.txt -Wait | Select-String ready"
level = "warn"
rules = ["follow-unbounded"]
fix = "$j = Start-Job { Set-Location -LiteralPath $using:PWD; Get-Content log.txt -Wait | Select-String ready | Out-String -Stream -Width 4096 }; $null = Wait-Job $j -Timeout 60; Receive-Job $j; Remove-Job $j -Force"

