level = "break"
rules = ["wait-loop-unbounded"]
fix = 'for i in $(seq 1 120); do { touch probe; grep -q done log; } && break; sleep 5; [ "$i" -lt 120 ]; done  # when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log'

[[row]]
id = "wl-ps-fix-keeps-a-compound-condition"
