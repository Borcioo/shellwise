# Twin rows (Ruling 161): a command substitution inside arithmetic reads like the same
# substitution outside it, and a name arithmetic reads like the same name read as text. Each row's
# `command` holds the substitution or the name in one arithmetic context of the Bash parser
# (`$(( ))`, `(( ))`, `let`, `[[ -eq ]]`, a `${a[i]}` subscript, `${s:o:l}`, `${!x}`, a
# `declare -i` name, `for (( ; ; ))`); `twin` holds the same command or read outside arithmetic.
# `level` and `rules` are the twin's verdict. `tests/delete.rs` runs both texts against its fixture
# (cwd FX_REPO, where `rm -rf build` reads ok), and asserts the two give the same rule ids. The
# inner commands: a known command, an unknown tool, a relative delete, a delete of a system folder
# (still judged inside arithmetic), `date +%s`; a name set by `read`; a positional parameter.

[[row]]
id = "twin-dollar-git-bash"
os = "any"
shell = "bash"
command = "echo $(( $(git rev-list --count HEAD) )); rm -rf build"
twin = "echo $(git rev-list --count HEAD); rm -rf build"
level = "ok"
rules = []

[[row]]
id = "twin-dollar-tool-bash"
