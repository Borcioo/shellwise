# Verdict rows for the parse kinds pwsh refuses (`EmptyPipeElement`, `MissingArgument`), the Fix-line
# hints of an unclosed quote, and one synthetic row per shape of the corpus texts the real shell
# accepts while our parser refuses them (warn, never break). `oracle` is what the real shell's
# parser does with the text (pwsh ParseInput, bash -n); every break row must say "refuses".

# --- An empty pipe element: pwsh refuses it ---

[[row]]
id = "empty-pipe-between-two-pipes"
os = "any"
shell = "pwsh"
command = "a | | b"
level = "break"
rules = ["parse-error"]
fix = "remove the empty | at column 3, or put the command after it on the same line"
oracle = "refuses"

[[row]]
id = "empty-pipe-at-the-end"
os = "any"
shell = "pwsh"
command = "Get-ChildItem |"
level = "break"
rules = ["parse-error"]
fix = "remove the empty | at column 15"
oracle = "refuses"

[[row]]
id = "empty-pipe-before-a-semicolon"
os = "any"
shell = "pwsh"
command = "Get-ChildItem | ; Get-Date"
level = "break"
rules = ["parse-error"]
fix = "remove the empty | at column 15"
oracle = "refuses"

[[row]]
id = "empty-pipe-before-a-closing-paren"
os = "any"
shell = "pwsh"
command = "(Get-ChildItem | )"
level = "break"
rules = ["parse-error"]
fix = "remove the empty | at column 16"
oracle = "refuses"

[[row]]
id = "empty-pipe-on-the-next-line"
os = "any"
shell = "pwsh"
command = "Get-ChildItem |\n| Out-Host"
level = "break"
rules = ["parse-error"]
fix = "remove the empty | at column 15"
oracle = "refuses"

[[row]]
id = "empty-pipe-before-a-chain-operator"
os = "any"
shell = "pwsh"
command = "Get-ChildItem | || Get-Date"
level = "break"
rules = ["parse-error"]
fix = "remove the empty | at column 15"
oracle = "refuses"

[[row]]
id = "empty-pipe-with-a-delete-is-break-only"
os = "any"
shell = "pwsh"
command = "Remove-Item -Recurse x | | Out-Host"
level = "break"
rules = ["parse-error"]
fix = "remove the empty | at column 24"
oracle = "refuses"

[[row]]
id = "a-foreach-statement-piped"
os = "any"
shell = "pwsh"
command = "foreach ($x in 1,2) { $x } | Out-Host"
level = "break"
rules = ["parse-error"]
fix = "write $( before the foreach at column 1 and ) before the | at column 28"
oracle = "refuses"

[[row]]
id = "an-if-statement-piped"
os = "any"
shell = "pwsh"
command = "Get-Date; if ($a) { 1 } else { 2 } | Out-Host"
level = "break"
rules = ["parse-error"]
fix = "write $( before the if at column 11 and ) before the | at column 36"
oracle = "refuses"

[[row]]
id = "a-for-statement-piped-inside-a-block"
os = "any"
shell = "pwsh"
command = "& { for ($i = 0; $i -lt 2; $i++) { $i } | Out-Host }"
level = "break"
rules = ["parse-error"]
fix = "write $( before the for at column 5 and ) before the | at column 41"
oracle = "refuses"

[[row]]
id = "a-while-statement-piped"
os = "any"
shell = "pwsh"
command = "while ($i -lt 1) { $i++ } | Out-Host"
level = "break"
rules = ["parse-error"]
fix = "write $( before the while at column 1 and ) before the | at column 27"
oracle = "refuses"

[[row]]
id = "a-switch-statement-piped"
os = "any"
shell = "pwsh"
command = "switch (1) { 1 { 'a' } } | Out-Host"
level = "break"
rules = ["parse-error"]
fix = "write $( before the switch at column 1 and ) before the | at column 26"
oracle = "refuses"

[[row]]
id = "empty-pipe-before-a-closing-brace"
os = "any"
shell = "pwsh"
command = "& { Get-ChildItem | }"
level = "break"
rules = ["parse-error"]
fix = "remove the empty | at column 19"
oracle = "refuses"

# A statement ends at `;` or a line end: a block piped after it is not the statement's.
[[row]]
id = "a-block-piped-after-a-foreach-and-a-semicolon-is-no-piped-statement"
os = "any"
shell = "pwsh"
command = "foreach ($x in 1) { $x }; & { 1 } | Out-Host\nGet-Date ("
level = "warn"
rules = ["parse-error"]
oracle = "refuses"

[[row]]
id = "a-block-piped-on-the-line-after-a-foreach-is-no-piped-statement"
os = "any"
shell = "pwsh"
command = "foreach ($x in 1) { $x }\n& { 1 } | Out-Host\nGet-Date ("
level = "warn"
rules = ["parse-error"]
oracle = "refuses"

[[row]]
id = "a-chain-operator-then-an-error-is-warn"
os = "any"
shell = "pwsh"
command = "Get-ChildItem || Get-Date\nGet-Date ("
level = "warn"
rules = ["parse-error"]
oracle = "refuses"
[[row]]
id = "allow-a-pipe"
os = "any"
shell = "pwsh"
command = "a | b"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "allow-a-pipe-at-the-line-end"
os = "any"
shell = "pwsh"
command = "Get-ChildItem |\nOut-Host"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "allow-a-comment-after-a-pipe"
os = "any"
shell = "pwsh"
command = "Get-ChildItem | # each item\nOut-Host"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "allow-pipes-inside-strings"
os = "any"
shell = "pwsh"
command = "Write-Output \"x | | y\" 'z |'"
