rules = []
oracle = "accepts"

# A pipe at the start of a line continues the pipeline above it: our parser does not read it, so it
# is warn, never a deny.
[[row]]
id = "a-pipe-starting-the-next-line-is-no-empty-element"
os = "any"
shell = "pwsh"
command = "Get-ChildItem\n| Out-Host"
level = "warn"
rules = ["parse-error"]
oracle = "accepts"

# --- A parameter followed by a comma: pwsh refuses it (MissingArgument) ---

[[row]]
id = "git-log-line-range"
os = "any"
shell = "pwsh"
command = "git log -L1,2:f.txt"
level = "break"
rules = ["parse-error"]
fix = "quote the argument: '-L1,2:f.txt'"
oracle = "refuses"

[[row]]
id = "git-log-line-range-with-a-format-and-a-pipe"
