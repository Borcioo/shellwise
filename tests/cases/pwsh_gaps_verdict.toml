# `--%` passes the rest of its line as text: such a text names no deny kind.
[[row]]
id = "a-stop-parsing-token-names-no-kind"
os = "any"
shell = "pwsh"
command = "x --% a | | b"
level = "warn"
rules = ["parse-error"]
oracle = "refuses"
