rules = ["parse-error"]
fix = "quote the argument: '-a,b'"
oracle = "refuses"

[[row]]
id = "allow-git-log-line-range-quoted"
os = "any"
shell = "pwsh"
command = "git log '-L1,2:f.txt'"
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "allow-git-log-line-range-after-a-space"
