# --- Fix-line hints of an unclosed quote ---

[[row]]
id = "backslash-quote-inside-a-double-quoted-string"
os = "any"
shell = "pwsh"
command = 'rg "a\"b"'
level = "break"
rules = ["parse-error"]
fix = """in PowerShell write a quote inside "…" as "" or use '…'"""
oracle = "refuses"

[[row]]
id = "typographic-quote-inside-a-double-quoted-string"
os = "any"
shell = "pwsh"
command = "gh pr create --body \"it”s\""
level = "break"
rules = ["parse-error"]
fix = """replace the typographic quote at column 24 with ' or \""""
oracle = "refuses"

[[row]]
id = "allow-a-doubled-quote"
os = "any"
shell = "pwsh"
command = 'rg "a""b"'
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "allow-an-apostrophe-inside-a-double-quoted-string"
os = "any"
shell = "pwsh"
command = "gh pr create --body \"it's\""
level = "ok"
rules = []
oracle = "accepts"

