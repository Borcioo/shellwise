[[row]]
id = "member-r-question-variable-block"
mechanism = "PowerShell ends the argument at `$?.` and calls the method on `{x}`"
parser = "refuses"
command = "Write-Output $?.{x}?.Delete()"
error = false
cmds = [["Write-Output", "$?.", "{x}?.Delete()"], ["x"]]
comments = []
methods = ["{x}.Delete"]

