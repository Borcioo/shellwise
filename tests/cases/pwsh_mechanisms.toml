id = "param-two-dash-two-backticks-subexpression"
mechanism = "an escaped backtick before `$` in a two-dash value: `$(\U00002026)` stays in the word"
command = "node ''--name=$$``$($m.p) x.js"
error = false
cmds = [["node", "''", "--name=$$``$($m.p)", "x.js"]]
comments = []
methods = []

[[row]]
id = "param-one-dash-quoted-value-subexpression"
mechanism = "a quote in a one-dash value makes it a word for PowerShell: `$(\U00002026)` stays in it"
command = "node -name=''$(ri C:\\x)"
error = false
cmds = [["node", "-name=''$(ri C:\\x)"], ["ri", "C:\\x"]]
comments = []
methods = []

[[row]]
id = "param-one-dash-quoted-space-value-subexpression"
mechanism = "a quoted value with a space, then `$(\U00002026)`: one word"
command = "node -name='a b'$(ri C:\\x)"
error = false
cmds = [["node", "-name='a b'$(ri C:\\x)"], ["ri", "C:\\x"]]
comments = []
methods = []

