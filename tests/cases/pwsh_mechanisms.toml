# One synthetic row (or more) per mechanism the parser spike measured (docs/spikes.md), and one per mechanism the differential fuzz found. `parser = "refuses"`: the parser fails closed on a command PowerShell accepts.
# Expected values are PowerShell 7.7.0's Parser::ParseInput answer (tests/pwsh_oracle.rs checks them).

[[row]]
id = "var-glued-path"
mechanism = "a variable glued to a path"
command = "Remove-Item -Recurse $d\\sub"
error = false
cmds = [["Remove-Item", "-Recurse", "$d\\sub"]]
comments = []
methods = []

