# ---------------------------------------------------------------- a body fed on stdin to a local shell
# A heredoc or here-string a local bash, sh, zsh or PowerShell reads as its program is read as the
# same shell's `-c` / `-Command` body: danger with a literal protected location, else warn.
# `tests/delete.rs` `a_body_fed_on_stdin_reads_as_its_c_twin` pins every carrier and form against
# its twin; these rows name the shapes.

[[row]]
id = "fed-heredoc-quoted-home"
os = "any"
shell = "bash"
command = "bash <<'EOF'\nrm -rf ~\nEOF"
level = "danger"
rules = ["opaque-destructive"]

[[row]]
id = "fed-heredoc-quoted-home-gitbash"
os = "windows"
shell = "gitbash"
command = "bash <<'EOF'\nrm -rf ~\nEOF"
level = "danger"
rules = ["opaque-destructive"]

[[row]]
id = "fed-heredoc-unquoted-home"
