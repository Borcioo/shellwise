os = "any"
shell = "pwsh"
command = 'Set-Alias ll Get-ChildItem; ll; Remove-Item .git -Recurse -Force'
level = "critical"
rules = ["delete-critical"]

# Redefined to a location cmdlet between the calls (twin: `Remove-Item build; Set-Location
# src; Remove-Item .git -Recurse -Force`, the location alias is not followed). Every value of a
# name counts at every call, so the delete through `zz src` is an unknown location too.
[[row]]
id = "ps-alias-redefined-to-a-location-cmdlet-between-calls"
os = "any"
shell = "pwsh"
command = 'Set-Alias zz Remove-Item; zz build; Set-Alias zz Set-Location; zz src; Remove-Item .git -Recurse -Force'
level = "warn"
rules = ["delete-unknown-location", "delete-unknown-location"]

# One of two values is a command the tables do not know (twin `ps-alias-call-then-alias-dotgit-twin`).
[[row]]
id = "ps-alias-one-value-unknown-then-real-dotgit"
os = "any"
shell = "pwsh"
command = 'Set-Alias zz Remove-Item; Set-Alias zz x; zz build; Remove-Item .git -Recurse -Force'
level = "warn"
rules = ["delete-unknown-location"]

# An alias whose value the guard cannot read keeps the location unknown after its call.
[[row]]
id = "ps-alias-unread-value-then-real-dotgit"
os = "any"
shell = "pwsh"
command = 'Set-Alias zz $v; zz build; Remove-Item .git -Recurse -Force'
level = "warn"
rules = ["delete-unknown-location"]

# An alias that shadows a shipped location name with a cmdlet that stays: `cd src` does not
# move, so `.git` is the repo's own.
[[row]]
id = "ps-alias-shadowing-a-location-name-then-real-dotgit"
os = "any"
shell = "pwsh"
command = 'Set-Alias cd Get-Date; cd src; Remove-Item .git -Recurse -Force'
level = "critical"
rules = ["delete-critical"]

# An alias whose name the guard cannot read may be any call's name: the location stays unknown.
[[row]]
id = "ps-alias-unread-name-then-real-dotgit"
os = "any"
shell = "pwsh"
command = 'Set-Alias $n Get-ChildItem; Get-ChildItem; Remove-Item .git -Recurse -Force'
level = "warn"
rules = ["delete-unknown-location"]

# A value that is a shipped cmdlet name the command itself redefines (an alias or a function of
# that name, compared as PowerShell compares names) runs the definition: the location is unknown
# after the call wherever the definition sits (Ruling 157).
[[row]]
id = "ps-alias-to-a-redefined-listing-name-then-system-delete"
os = "windows"
shell = "pwsh"
command = 'Set-Alias Get-ChildItem Set-Location; Set-Alias zz Get-ChildItem; zz C:\Windows; Remove-Item System32 -Recurse -Force'
level = "warn"
rules = ["delete-unknown-location"]

[[row]]
id = "ps-alias-to-a-listing-name-redefined-later-then-system-delete"
os = "windows"
shell = "pwsh"
