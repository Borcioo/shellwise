# Ruling 127 (oracle, pwsh 7.7): a PowerShell wildcard
# takes the hidden `.git` only with -Force; without it the repo root's contents are danger.
[[row]]
id = "ps-ri-repo-contents-without-force"
os = "windows"
shell = "pwsh"
command = "Remove-Item -Recurse *"
level = "danger"
rules = ["delete-repo-contents"]

[[row]]
id = "ps-ri-repo-contents-force-alias"
os = "windows"
shell = "pwsh"
command = "rm -r -fo *"
level = "critical"
rules = ["delete-critical"]

# R1-6: a `.git` without the Hidden attribute (WSL git, a copied repo) is taken by the wildcard
# even without -Force (oracle R1/gitnohide.out); FX_REPO's `.git` is hidden, as `git init` makes it.
[[row]]
id = "plaingit-ps-ri-repo-contents-without-force"
os = "windows"
shell = "pwsh"
command = "Remove-Item -Recurse *"
level = "critical"
rules = ["delete-critical"]

# Git Bash's `*` skips a dot name whatever its attributes.
[[row]]
id = "plaingit-gb-rm-rf-star"
os = "windows"
shell = "gitbash"
command = "rm -rf *"
level = "danger"
rules = ["delete-repo-contents"]

