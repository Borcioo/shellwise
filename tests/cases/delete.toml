[[row]]
id = "fed-control-heredoc-zsh-emulate-then-a-script"
os = "any"
shell = "bash"
command = "zsh --emulate sh run.sh <<'EOF'\nrm -rf ~\nEOF"
level = "ok"
rules = []

# zsh's -O is a flag: the word after it is the script.
[[row]]
id = "fed-control-heredoc-zsh-capital-o-then-a-script"
os = "any"
shell = "bash"
command = "zsh -O extglob <<'EOF'\nrm -rf ~\nEOF"
level = "ok"
rules = []

# `cat` writes its fd-0 heredoc whatever other descriptors it is given; a redirect of its output,
# a file on its stdin or a duplicated descriptor leaves the text unread.
[[row]]
id = "fed-pipe-cat-heredoc-beside-another-descriptor-home"
os = "any"
shell = "bash"
command = "cat <<'EOF' 3<<'X' | bash\nrm -rf ~\nEOF\nhello\nX"
level = "danger"
rules = ["opaque-destructive"]

[[row]]
id = "fed-pipe-cat-heredoc-after-another-descriptor-home"
os = "any"
shell = "bash"
command = "cat 3<<'X' <<'EOF' | bash\nhello\nX\nrm -rf ~\nEOF"
level = "danger"
rules = ["opaque-destructive"]

[[row]]
id = "fed-pipe-cat-heredoc-stderr-to-a-file-home"
os = "any"
shell = "bash"
command = "cat <<'EOF' 2>/dev/null | bash\nrm -rf ~\nEOF"
level = "danger"
rules = ["opaque-destructive"]

[[row]]
id = "fed-control-pipe-cat-heredoc-output-to-a-file"
os = "any"
shell = "bash"
command = "cat <<'EOF' >out.txt | bash\nrm -rf ~\nEOF"
level = "ok"
rules = []

[[row]]
id = "fed-control-pipe-cat-heredoc-descriptor-copied"
os = "any"
shell = "bash"
command = "cat <<'EOF' 0<&3 | bash\nrm -rf ~\nEOF"
level = "ok"
rules = []

[[row]]
id = "fed-control-pipe-cat-heredoc-on-another-descriptor-only"
os = "any"
shell = "bash"
command = "cat 3<<'X' | bash\nrm -rf ~\nX"
level = "ok"
rules = []

# What a producer writes is read only when the guard has its exact text.
[[row]]
id = "fed-control-pipe-cat-file-beside-a-heredoc"
os = "any"
shell = "bash"
command = "cat notes.txt <<'EOF' | bash\nrm -rf ~\nEOF"
level = "ok"
rules = []

[[row]]
id = "fed-control-pipe-echo-to-a-file"
os = "any"
shell = "bash"
command = "echo 'rm -rf ~' >out.txt | bash"
level = "ok"
rules = []

[[row]]
id = "fed-control-pipe-printf-number-format"
os = "any"
shell = "bash"
command = "printf '%d\\n' 'rm -rf ~' | bash"
level = "ok"
rules = []

# `echo -n` drops the last newline only; `-e` renders `\n`, `\t` and `\\`, and any other escape is
# not read.
[[row]]
id = "fed-pipe-echo-without-newline-home"
os = "any"
shell = "bash"
command = "echo -n 'echo hi; rm -rf ~' | bash"
level = "danger"
rules = ["opaque-destructive"]

[[row]]
id = "fed-pipe-echo-with-escapes-home"
os = "any"
shell = "bash"
command = "echo -ne 'cd /tmp\\nrm -rf ~' | bash"
level = "danger"
rules = ["opaque-destructive"]

# Known miss: an escape other than those three (`\c` ends the text) is not read.
[[row]]
id = "known-miss-fed-pipe-echo-with-another-escape"
os = "any"
shell = "bash"
command = "echo -e 'rm -rf ~\\c' | bash"
level = "ok"
rules = []

# A later `-E` turns the escapes off again: the backslash stays, and that is not read.
[[row]]
id = "fed-control-pipe-echo-with-escapes-turned-off-again"
os = "any"
shell = "bash"
command = "echo -eE 'cd /tmp\\nrm -rf ~' | bash"
level = "ok"
rules = []

[[row]]
id = "fed-control-pipe-echo-with-a-backslash-and-no-option"
os = "any"
shell = "bash"
command = "echo 'cd /tmp\\nrm -rf ~' | bash"
level = "ok"
rules = []

# Known miss: a printf argument holding `$`, a backtick, `\` or `%` is not read, as the producer
# text the scan of a command that does not parse reads.
[[row]]
id = "known-miss-fed-pipe-printf-line-argument-with-a-backslash"
os = "any"
shell = "bash"
command = "printf '%s\\n' 'rm -rf ~/a\\b' | bash"
level = "ok"
rules = []

# Known miss: a here-string on `cat` is not read, as the scan of a command that does not parse
# does not read it.
[[row]]
id = "known-miss-fed-pipe-cat-here-string"
os = "any"
shell = "bash"
command = "cat <<< 'rm -rf ~' | bash"
level = "ok"
rules = []

[[row]]
id = "fed-heredoc-after-a-plus-option-home"
os = "any"
shell = "bash"
command = "bash +o errexit <<'EOF'\nrm -rf ~\nEOF"
level = "danger"
rules = ["opaque-destructive"]

# A fed shell inside a loop, a condition or a function, and each fed shell with its own body.
[[row]]
id = "fed-here-string-in-a-loop-home"
os = "any"
shell = "bash"
command = "for i in 1; do bash <<< 'rm -rf ~'; done"
level = "danger"
rules = ["opaque-destructive"]

[[row]]
id = "fed-here-string-in-a-condition-home"
os = "any"
shell = "bash"
command = "if true; then bash <<< 'rm -rf ~'; fi"
level = "danger"
rules = ["opaque-destructive"]

[[row]]
id = "fed-here-string-in-a-function-home"
os = "any"
shell = "bash"
command = "f() { bash <<< 'rm -rf ~'; }"
level = "danger"
rules = ["opaque-destructive"]

[[row]]
id = "fed-here-string-two-shells-each-its-body"
os = "any"
shell = "bash"
command = "bash <<< 'rm -rf build'; bash <<< 'rm -rf ~'"
level = "danger"
rules = ["opaque-destructive", "opaque-destructive"]

# Known miss: beside a syntax error a printf argument holding `\` is not read either.
[[row]]
id = "known-miss-fed-pipe-printf-line-argument-with-a-backslash-beside-a-syntax-error"
os = "any"
shell = "bash"
command = "printf '%s\\n' 'rm -rf ~/a\\b' | bash\n; )"
level = "warn"
rules = ["parse-error"]

# A PowerShell prefix a switch shares with a value parameter is the switch: `-i` is
# `-Interactive`, so `run.ps1` is the file and stdin is data.
[[row]]
id = "fed-control-here-string-pwsh-switch-prefix-then-a-file"
os = "any"
shell = "bash"
command = "pwsh -i run.ps1 <<< 'rm -rf ~'"
level = "ok"
rules = []

[[row]]
id = "fed-heredoc-time-home"
os = "any"
shell = "bash"
command = "time bash <<'EOF'\nrm -rf ~\nEOF"
level = "danger"
rules = ["opaque-destructive"]

# Known miss: `time` after a pipe is the program, not the keyword, and is not read through.
[[row]]
id = "known-miss-fed-pipe-echo-to-time-bash"
os = "any"
shell = "bash"
command = "echo 'rm -rf ~' | time bash"
level = "ok"
rules = []

# PowerShell with `-NoExit` runs the file or the command and then reads stdin as commands.
[[row]]
id = "fed-here-string-pwsh-no-exit-after-a-file-home"
os = "any"
shell = "bash"
command = "pwsh -NoExit -File run.ps1 <<< 'Remove-Item -Recurse -Force ~'"
level = "danger"
rules = ["opaque-destructive"]
