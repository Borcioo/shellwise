level = "ok"
rules = []

[[row]]
id = "gb-cd-existing-or-group-exit"
os = "windows"
shell = "gitbash"
command = 'cd build || { echo no; exit 1; }; rm -rf *'
level = "ok"
rules = []

[[row]]
