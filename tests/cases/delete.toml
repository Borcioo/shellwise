# The delete guard (Ruling 98(2), F14), the opaque-destructive rule and the allow marker,
# through analyse. `tests/delete.rs` runs every row against a fixture tree:
#
#   FX_REPO       a repo (holds `.git`): the default cwd. Inside it: `build/x.o`, `src/a.txt`,
#                 `clean/f.txt`, `linked/out` (a junction or symlink to FX_OUTSIDE/target),
#                 `jn` (a junction or symlink to FX_OUTSIDE/target).
#   FX_NOREPO     a folder outside any repo, with `sub/f.txt`: the cwd of `norepo-` rows.
#   FX_OUTSIDE    outside the project: `data/f.txt`, `target/keep.txt`.
#   FX_ALLOWED    the one allowed root (`cfg.allowed_roots`, and `TEMP`/`TMP` in the env):
#                 `tmp1/f.txt`, `box/out` (a link to FX_OUTSIDE/target).
#   FX_HOME       the home folder (`USERPROFILE` and `HOME` in the env).
#   FX_PROTECTED  `cfg.protected`.
#   FX_ROOT       the folder holding all of them.
#
# The runner replaces each FX_ name with its path (forward slashes for bash rows). A row whose
# id starts with `nocwd-` runs with no cwd, `norepo-` with the cwd FX_NOREPO, `unccwd-` with a
# cwd on a share no host answers (the twin `unccwd-git-clean` stays an unknown location),
# `admincwd-` with the cwd `\\localhost\C$`, and `scratch-` with `scratch_dir` set to FX_OUTSIDE. Every path the fixture uses has no space.
# The rows are synthetic and ranked by the corpus counts of their shapes (2026-11-19, 50,862
# rows): `git worktree remove` 320, `[IO.Directory]::Delete` 260, `Remove-Item` with
# `-ErrorAction` 215, `Remove-Item -Recurse` 199, `rm -rf` 152, `rm <file>` 141,
# `[IO.File]::Delete` 100, `rm -rf $VAR` 59, `Remove-Item a,b` 32, `bash -c` with `rm` 19,
# `find -exec rm` 13, `find -delete` 9, `Remove-Item` fed by a pipeline 9, `robocopy /MIR` 8,
# `xargs rm` 0. Obfuscation-only shapes get no row (Ruling 91).

