level = "warn"
rules = ["dynamic-target"]

# ---------------------------------------------------------------- Task 34 C1: `${X:?}`
# `${X:?}` (the operator right after the name) stops the command when X is empty or unset: no
# empty-expansion candidate. `${X?}` passes an empty X, and `${X:-a:?b}` is a default.
[[row]]
id = "gb-required-var-contents"
os = "windows"
shell = "gitbash"
command = 'rm -rf "${BUILD_DIR:?}"/*'
level = "warn"
rules = ["dynamic-target"]

[[row]]
id = "gb-required-var-slash"
