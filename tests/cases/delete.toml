# ---------------------------------------------------------------- Task 34 C9: a reassignment after a dynamic one
# A top-level unconditional assignment replaces whatever the name held; an earlier assignment
# that may run later (a function body) still makes the name dynamic.
[[row]]
id = "gb-literal-after-a-substitution"
os = "windows"
shell = "gitbash"
command = 'X=$(pwd); X=/; rm -rf "$X"'
level = "critical"
rules = ["delete-critical"]

[[row]]
id = "gb-literal-build-after-a-substitution"
os = "windows"
shell = "gitbash"
command = 'X=$(pwd); X=build; rm -rf "$X"'
level = "ok"
rules = []

[[row]]
id = "gb-literal-after-a-function-assignment"
os = "windows"
shell = "gitbash"
command = 'f() { X=/; }; X=build; f; rm -rf "$X"'
level = "warn"
rules = ["dynamic-target"]

# An absolute value needs no location: only the function body's assignment keeps it dynamic.
[[row]]
id = "gb-absolute-literal-after-a-function-assignment"
os = "windows"
shell = "gitbash"
command = 'f() { X=/; }; X=FX_REPO/build; f; rm -rf "$X"; X=b'
level = "warn"
rules = ["dynamic-target"]

[[row]]
id = "gb-conditional-literal-after-a-substitution"
os = "windows"
shell = "gitbash"
command = 'X=$(pwd) && X=/; rm -rf "$X"'
level = "warn"
rules = ["dynamic-target"]

# `${Y:=/}` assigns Y: the statement it stands in stays marked when X is replaced.
[[row]]
id = "gb-literal-after-an-assigning-expansion"
os = "windows"
shell = "gitbash"
command = 'Y=build; X=${Y:=/}; X=b; rm -rf "$Y"/'
level = "danger"
rules = ["delete-empty-expansion"]

# A PowerShell expression value may assign other names in place: the statement stays marked.
[[row]]
id = "ps-literal-after-an-expression"
os = "windows"
shell = "pwsh"
command = "$x = (Get-Location).Path; $x = 'C:\\'; Remove-Item -Recurse -Force $x"
level = "warn"
rules = ["dynamic-target"]

