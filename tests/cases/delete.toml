command = 'rm -rf "${BUILD_DIR:-}"/*'
level = "danger"
rules = ["delete-empty-expansion"]

# ---------------------------------------------------------------- Task 34 C2 (Ruling 127): a certain `cd`
# A `cd` leaves no fallback to the old folder only in forms the execution oracle proves
# (Git Bash 5.2.37 in the Bash tool's `… && eval '…' && pwd -P` shape, pwsh 7.7 and Windows PowerShell 5.1 in the tool's
# Invoke-Expression launcher): Bash `cd X || exit`, pwsh `$ErrorActionPreference = 'Stop'` and
# `-ErrorAction Stop`, and a literal folder that exists on disk when nothing before it may change
# the disk. `nosuch` exists nowhere, `build` is in the repo.
[[row]]
id = "gb-cd-missing-or-exit"
os = "windows"
shell = "gitbash"
command = 'cd nosuch || exit 1; rm -rf *'
level = "ok"
rules = []

[[row]]
id = "gb-cd-missing-or-bare-exit"
os = "windows"
shell = "gitbash"
command = 'cd nosuch || exit; rm -rf ./*'
level = "ok"
rules = []

[[row]]
id = "gb-cd-missing-or-exit-on-its-line"
os = "windows"
shell = "gitbash"
command = "cd nosuch || exit 1\nrm -rf *"
level = "ok"
rules = []

[[row]]
id = "gb-cd-missing-then-glob"
os = "windows"
shell = "gitbash"
command = 'cd nosuch; rm -rf *'
level = "danger"
rules = ["delete-repo-contents"]

# The oracle: `return` outside a function fails and the next command runs in the old folder.
[[row]]
id = "gb-cd-missing-or-return"
os = "windows"
shell = "gitbash"
command = 'cd nosuch || return; rm -rf *'
level = "danger"
rules = ["delete-repo-contents"]

# The oracle: the Bash tool runs the command inside an `&&` list, where `set -e` is ignored.
[[row]]
id = "gb-cd-missing-after-set-e"
os = "windows"
shell = "gitbash"
command = 'set -e; cd nosuch; rm -rf *'
level = "danger"
rules = ["delete-repo-contents"]

# The IR does not tell a brace group from a subshell, whose `exit` leaves only the subshell.
[[row]]
id = "gb-cd-missing-or-group-exit"
os = "windows"
shell = "gitbash"
command = 'cd nosuch || { echo no; exit 1; }; rm -rf *'
level = "danger"
rules = ["delete-repo-contents"]

# An `exit` in a pipeline runs in a subshell.
[[row]]
id = "gb-cd-missing-or-piped-exit"
os = "windows"
shell = "gitbash"
command = 'cd nosuch || exit 1 | cat; rm -rf *'
level = "danger"
rules = ["delete-repo-contents"]

# The `cd` itself may not run.
[[row]]
id = "gb-cd-missing-after-or-or-exit"
os = "windows"
shell = "gitbash"
command = 'test -d x || cd nosuch || exit 1; rm -rf *'
