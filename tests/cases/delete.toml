# robocopy /MIR is recursive: a destination holding a link leads out of it.
[[row]]
id = "ps-robocopy-mir-onto-a-linked-tree"
os = "windows"
shell = "pwsh"
command = "robocopy src linked /MIR"
level = "danger"
rules = ["delete-through-link"]

