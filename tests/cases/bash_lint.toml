id = "d9-unquoted-path-letter-colon-escaped-space"
os = "any"
shell = "gitbash"
command = 'echo a:\ b'
level = "break"
rules = ["bash-unquoted-backslash-path"]

# Surviving mutants of the slice D review. D01/D04: a line continuation inside a quoted
# substitution gives its words the outer word's span (an inexact origin), which may still read as
# one quoted word. For `cd /d` the span-order guard (exact_spans) keeps the rule silent rather
# than print a Fix line built from the whole outer word; for an unquoted path the one-word guard
# and the quote tracking do (a missed break, kept).
[[row]]
id = "d01-cd-slash-d-with-an-inexact-span-is-silent"
os = "any"
shell = "gitbash"
command = "echo \"$(cd /d \\\nD:/x && ls)\""
level = "ok"
rules = []

[[row]]
id = "d04-unquoted-path-with-an-inexact-span-is-silent"
os = "any"
shell = "gitbash"
command = "echo \"$(echo a \\\n; ls C:\\x)\""
level = "ok"
rules = []


# D04: the inner command has no arguments, so its name's span cannot be checked against them; the
# one-word guard keeps the rule from reading the whole outer word (a missed break, kept).
[[row]]
id = "d04-unquoted-path-command-name-with-an-inexact-span-is-silent"
os = "any"
shell = "gitbash"
command = "echo $(echo a \\\n; C:\\x)"
level = "ok"
rules = []

# --- gate-truncated-pipeline (warn) in Bash, both profiles: the PowerShell rule's decisions ---
# A tee'd producer, or a configured gate command, piped at any later stage into `head` (any
# count) is cut; `tail` reads the whole stream (the twin of `Select-Object -Last`), and so does
# `sed -n 'Np'`. The Fix keeps the producer, reads it whole with `tail -n 20` and keeps its exit
# code with `pipefail`, in a subshell so the option does not outlive the call.

[[row]]
id = "gate-bash-tee-then-head-n"
os = "any"
shell = "gitbash"
command = "npm test 2>&1 | tee run.log | head -n 5"
level = "warn"
rules = ["gate-truncated-pipeline"]
fix = "(set -o pipefail; npm test 2>&1 | tee run.log | tail -n 20)"

[[row]]
id = "gate-posix-bash-tee-then-head-n"
os = "any"
shell = "bash"
command = "npm test 2>&1 | tee run.log | head -n 5"
level = "warn"
rules = ["gate-truncated-pipeline"]
fix = "(set -o pipefail; npm test 2>&1 | tee run.log | tail -n 20)"

[[row]]
id = "gate-bash-tee-then-bare-head"
os = "any"
shell = "gitbash"
command = "cargo test 2>&1 | tee test.log | head"
level = "warn"
rules = ["gate-truncated-pipeline"]

[[row]]
id = "gate-bash-tee-then-a-filter-then-head"
os = "any"
shell = "gitbash"
command = "npm test 2>&1 | tee run.log | grep -v skipped | head -n 3"
level = "warn"
rules = ["gate-truncated-pipeline"]
fix = "(set -o pipefail; npm test 2>&1 | tee run.log | grep -v skipped | tail -n 20)"

[[row]]
id = "gate-bash-configured-gate-then-head"
os = "any"
shell = "gitbash"
command = "./scripts/run-gate.sh --all | head -n 5"
level = "warn"
rules = ["gate-truncated-pipeline"]
fix = "(set -o pipefail; ./scripts/run-gate.sh --all | tail -n 20)"
config = "gate_commands = ['run-gate*']\n"

[[row]]
id = "gate-bash-allow-a-configured-gate-into-tee-only"
os = "any"
shell = "gitbash"
command = "./scripts/run-gate.sh --all | tee gate.log"
level = "ok"
rules = []
config = "gate_commands = ['run-gate*']\n"

[[row]]
id = "gate-bash-allow-tee-alone"
os = "any"
shell = "gitbash"
command = "npm test 2>&1 | tee run.log"
level = "ok"
rules = []

[[row]]
id = "gate-bash-allow-head-without-a-gate-or-tee"
os = "any"
shell = "gitbash"
command = "cat file | head -n 5"
level = "ok"
rules = []

[[row]]
id = "gate-bash-allow-tail"
os = "any"
shell = "gitbash"
command = "npm test 2>&1 | tee run.log | tail -n 20"
level = "ok"
rules = []

[[row]]
id = "gate-bash-allow-sed-print-one-line"
os = "any"
shell = "gitbash"
command = "npm test 2>&1 | tee run.log | sed -n '5p'"
level = "ok"
rules = []

# --- bash-ps-call-operator (break), both profiles: a command that starts with `&` ---
# bash refuses the line (syntax error, exit 2); the rule replaces the parser's `parse-error` warn
# for that error. The Fix is the user's text without the `&`; a PowerShell-only operand gets a
# sentence.

[[row]]
id = "call-op-double-quoted-path"
os = "any"
shell = "gitbash"
command = '& "C:/path/tool.exe" args'
level = "break"
rules = ["bash-ps-call-operator"]
fix = '"C:/path/tool.exe" args'

[[row]]
id = "call-op-double-quoted-path-posix-bash"
os = "any"
shell = "bash"
command = '& "C:/path/tool.exe" args'
level = "break"
rules = ["bash-ps-call-operator"]
fix = '"C:/path/tool.exe" args'

# Git Bash starts a quoted path with backslashes: the operand stays as written.
[[row]]
id = "call-op-double-quoted-backslash-path"
os = "any"
shell = "gitbash"
command = '& "C:\Program Files\Git\bin\bash.exe" -c x'
level = "break"
rules = ["bash-ps-call-operator"]
fix = '"C:\Program Files\Git\bin\bash.exe" -c x'

[[row]]
id = "call-op-single-quoted-name"
os = "any"
shell = "gitbash"
command = "& 'x.exe'"
level = "break"
rules = ["bash-ps-call-operator"]
fix = "'x.exe'"

[[row]]
id = "call-op-variable"
