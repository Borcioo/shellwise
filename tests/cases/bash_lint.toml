# The Git Bash rules (src/rules/bash_lint.rs), through analyse. Every rule fires only for the Git
# Bash profile (shell = "gitbash"); each has a twin with shell = "bash" (the POSIX profile) that
# stays ok. The rows are synthetic: none is a corpus command.
#
# baseline-guard rows: 29
# Rows whose id starts with "sg-" are ported from baseline-guard's tests/test_rules.py (its Bash rows
# for these rules and its bash-backslash-collapse block). Left out, because another task owns the
# rule: the 2 marker rows (Task 32), bat-metachar (Task 30), bash-unterminated-quote (2 rows,
# parse-error), bash-ps-call-operator (dropped, F17) and bash-too-long (Task 25).
#
# Levels differ from baseline-guard's deny where the plan lands a rule as warn: msys (the plan), and
# the landing-rule rules whose corpus replay denies more than 5 ok rows (versioned-php 33,
# vendor-bin 31). ps-cmdlet (2) and unquoted-backslash-path (0) are break. bash-backslash-collapse
# is break only for the shapes in PROVEN (printf / echo -e escapes, quoted heredoc bodies, and the
# expanding-heredoc pairs whose bytes change) and warn for every other `\\`.
#
# TOML: '...' strings hold backslashes as written; "..." strings write each backslash as \\.

# --- baseline-guard: Bash rows that must deny ---

[[row]]
id = "sg-unquoted-path-cd"
os = "any"
shell = "gitbash"
command = 'cd X:\src\x && git status'
level = "break"
rules = ["bash-unquoted-backslash-path"]
fix = "write X:/src/x with forward slashes"

[[row]]
id = "sg-unquoted-path-git-c"
os = "any"
shell = "gitbash"
command = 'git -C X:\src\timer status'
level = "break"
rules = ["bash-unquoted-backslash-path"]
fix = "write X:/src/timer with forward slashes"

[[row]]
id = "sg-cd-slash-d"
os = "any"
shell = "gitbash"
command = 'cd /d X:\src\x && dotnet test'
level = "break"
rules = ["bash-cd-slash-d", "bash-unquoted-backslash-path"]
fix = 'cd "X:/src/x"'

[[row]]
id = "sg-ps-cmdlet"
os = "any"
shell = "gitbash"
command = 'Get-ChildItem -Path C:/x -Recurse | Select-Object -First 5'
level = "break"
rules = ["bash-ps-cmdlet"]
fix = "run this in the PowerShell tool"

[[row]]
id = "sg-versioned-php"
os = "any"
shell = "gitbash"
command = 'cd D:/x && php83 -l a.php'
level = "warn"
rules = ["bash-versioned-php"]
fix = "call the php.exe of that version by its full path"

[[row]]
id = "sg-vendor-bin"
os = "any"
shell = "gitbash"
command = 'vendor/bin/pint --dirty 2>&1 | tail -5'
level = "warn"
rules = ["bash-vendor-bin-shebang"]
fix = "php vendor/bin/pint"

[[row]]
id = "sg-msys-path-mangle"
os = "any"
shell = "gitbash"
command = 'docker exec web php /var/www/html/x.php'
level = "warn"
rules = ["bash-msys-path-mangle"]
fix = "prefix MSYS_NO_PATHCONV=1"

[[row]]
id = "sg-collapse-program-path"
os = "any"
shell = "gitbash"
command = 'X:\\src\\x\\tool.exe --help'
level = "warn"
rules = ["bash-backslash-collapse"]
fix = "write the text with the Write tool"

