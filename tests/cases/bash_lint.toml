# D9 (rows only, at their current level; low plausibility): bash bounds a read under TMOUT
# (rc 142), `env read` fails at once (127), an earlier `exec <` feeds it (documented limit), and
# `a:\ ` is no drive path. Each is a false deny the rule keeps for now.
