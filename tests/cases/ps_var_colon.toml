# An unquoted $(...) holding the string: one finding, from the inner string only.
[[row]]
id = "unquoted-subexpression"
os = "any"
shell = "pwsh"
command = 'Write-Output $(Write-Output "$n: y")'
level = "break"
rules = ["ps-var-colon"]
fix = 'write "${n}:" instead of "$n:"'
oracle = "refuses"

