[[row]]
id = "inside-a-subexpression"
os = "any"
shell = "pwsh"
command = 'Write-Output "x $(Write-Output "$n: y")"'
level = "break"
rules = ["ps-var-colon"]
fix = 'write "${n}:" instead of "$n:"'
oracle = "refuses"

[[row]]
id = "in-an-assignment"
os = "any"
shell = "pwsh"
command = '$m = "$n: done"'
level = "break"
rules = ["ps-var-colon"]
fix = 'write "${n}:" instead of "$n:"'
