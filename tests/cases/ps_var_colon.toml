# A name with a letter outside ASCII (U+017C): PowerShell reads it whole.
[[row]]
id = "name-with-a-non-ascii-letter"
os = "any"
shell = "pwsh"
command = "Write-Output \"$za\u017c: x\""
level = "break"
rules = ["ps-var-colon"]
fix = "write \"${za\u017c}:\" instead of \"$za\u017c:\""
oracle = "refuses"

# --- Allow twins ---

# `::` after the name is a static member; `?` and a letter outside ASCII (U+0105) are name
# characters, so `$n:?z` and `$n:` U+0105 `z` are drive references.
[[row]]
id = "question-mark-after-the-colon"
os = "any"
shell = "pwsh"
command = 'Write-Output "$n:?z"'
level = "ok"
rules = []
oracle = "accepts"

