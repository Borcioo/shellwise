# `?` is a name character: `$a?:` is a variable `a?` on a drive.
[[row]]
id = "a-name-ending-in-a-question-mark"
os = "any"
shell = "pwsh"
command = 'Write-Output "$a?: x"'
level = "break"
rules = ["ps-var-colon"]
fix = 'write "${a?}:" instead of "$a?:"'
oracle = "refuses"

# --- Allow twins ---

# Inside $(...) and ${...} the outer string's rules do not apply: a single-quoted string there is
# literal, and a braced name may hold a colon.
[[row]]
id = "single-quoted-inside-a-subexpression"
os = "any"
shell = "pwsh"
command = "Write-Output \"$('$n: x')\""
level = "ok"
rules = []
oracle = "accepts"

[[row]]
id = "braced-name-holding-a-colon"
os = "any"
shell = "pwsh"
command = 'Write-Output "${x $n: y}"'
level = "ok"
rules = []
oracle = "accepts"

# `::` after the name is a static member; `?` and a letter outside ASCII (U+0105) are name
# characters, so `$n:?z` and `$n:` U+0105 `z` are drive references.
[[row]]
id = "question-mark-after-the-colon"
os = "any"
shell = "pwsh"
command = 'Write-Output "$n:?z"'
level = "ok"
rules = []
oracle = "accepts"

