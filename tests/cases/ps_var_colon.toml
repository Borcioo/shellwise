# The ps-var-colon rule through analyse: `"$name: text"` in a PowerShell double-quoted string is
# break, because PowerShell reads `$name:` as a drive-qualified variable and refuses the string.
# `oracle` says what pwsh's ParseInput does with the text; every break row must say "refuses" and
# every allow twin "accepts".

# --- Findings ---

[[row]]
id = "name-colon-space"
os = "any"
shell = "pwsh"
command = 'Write-Output "$n: done"'
level = "break"
rules = ["ps-var-colon"]
fix = 'write "${n}:" instead of "$n:"'
oracle = "refuses"

[[row]]
id = "name-colon-variable"
os = "any"
shell = "pwsh"
command = 'Write-Output "$f:$l"'
level = "break"
rules = ["ps-var-colon"]
fix = 'write "${f}:" instead of "$f:"'
oracle = "refuses"

[[row]]
id = "automatic-variable-colon-space"
os = "any"
shell = "pwsh"
command = 'Write-Output "$LASTEXITCODE: x"'
level = "break"
rules = ["ps-var-colon"]
fix = 'write "${LASTEXITCODE}:" instead of "$LASTEXITCODE:"'
oracle = "refuses"

[[row]]
id = "name-colon-at-the-end-of-the-string"
os = "any"
