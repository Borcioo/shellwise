[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# rshellcheck-core (the ShellCheck port `shellwise lint <file>` links) pulls im-rc and its two
# helpers. All three are unmaintained, with no known vulnerability; accepted until the port drops
# them, and reachable from `lint <file>` only.
ignore = [
    # bitmaps: unmaintained, through im-rc.
    "RUSTSEC-2026-0247",
    # im-rc: unmaintained, the port's persistent maps.
    "RUSTSEC-2026-0250",
    # sized-chunks: unmaintained, through im-rc.
    "RUSTSEC-2026-0251",
]

[licenses]
version = 2
# MPL-2.0 (file-level copyleft, GPL-3.0 compatible): im-rc, sized-chunks and bitmaps, through
# rshellcheck-core.
allow = ["GPL-3.0-or-later", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib", "MPL-2.0"]
confidence-threshold = 0.9
# tree-sitter (through serde_json's hash map) pulls foldhash, licensed Zlib (permissive, OSI).
exceptions = [{ crate = "foldhash", allow = ["Zlib"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
