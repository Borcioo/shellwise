# The program table: every program name, alias, option spelling and per-program fact the rules
# use. Read by `src/programs.rs` (the one walker); rule code holds no program or option names.
# Only programs that occur in the corpus or the trap catalogue go in.
#
# [[program]]
# name           = "timeout"          the name as a shell finds it, lowercase; a path and `.exe`
#                                     on the typed name are ignored (`/usr/bin/timeout`,
#                                     `timeout.exe`), and case is ignored on Windows and Git Bash
# shells         = ["bash"]           where the name applies: "bash", "pwsh"; [] or absent = both
# aliases        = { bash = [], pwsh_windows = [], pwsh_posix = [] }
#                                     further names per shell (the alias keys are optional)
# kind           = ["wrapper"]        any of "wrapper", "native-msys", "delete", "eval", "shell",
#                                     "interactive", "launcher"
# value_options  = ["-s"]             options that take the next word as their value
# fix            = "..."              the Fix line text a rule about this program prints; `<path>`
#                                     and the like are filled in by the rule (`<command>`: the command as typed)
#
# Wrapper facts (kind = "wrapper"; `programs::strip_wrappers` reads them):
# operands       = 1                  words before the wrapped command that are not options
#                                     (`timeout DURATION cmd`)
# assignments    = true               `NAME=value` words before the command are assignments to it
# no_run_options = ["-v"]             with one of these the wrapper runs nothing (`command -v x`)
# flag_options   = ["-p"]             options that take no value; with value_options and
#                                     no_run_options, from the tool's own help. Any other option
#                                     makes the wrapped command unread: it may take a value.
#
# Rule facts:
# escapes        = "always"           the program turns `\\` into `\` itself: "always" (printf) or
#                                     "option" (only with one of `escape_options`, echo -e)
# escape_options = ["-e"]             for escapes = "option"; a short cluster holding the letter
#                                     counts (`-ne`)
# cmd_options    = ["/d"]             cmd.exe spellings that break in this shell (`cd /d`)
#
# Any other key is kept for the task that reads it (`Program::extra`).

# --- Wrappers: run the rest of their words as a command (Ruling 93: only the common ones) ---

[[program]]
name = "timeout"
shells = ["bash"]
kind = ["wrapper"]
value_options = ["-s", "--signal", "-k", "--kill-after"]
flag_options = ["--preserve-status", "--foreground", "-v", "--verbose"]
operands = 1
bounds_wait = true

[[program]]
name = "nice"
shells = ["bash"]
kind = ["wrapper"]
value_options = ["-n", "--adjustment"]

# `-S` (`--split-string`) is listed nowhere on purpose: its value is the command.
[[program]]
name = "env"
shells = ["bash"]
kind = ["wrapper"]
value_options = ["-u", "--unset", "-C", "--chdir", "-a", "--argv0"]
flag_options = ["-", "-i", "--ignore-environment", "-0", "--null", "-v", "--debug", "--block-signal", "--default-signal", "--ignore-signal", "--list-signal-handling"]
assignments = true

[[program]]
name = "sudo"
shells = ["bash"]
kind = ["wrapper"]
value_options = ["-u", "--user", "-g", "--group", "-C", "--close-from", "-D", "--chdir", "-h", "--host", "-p", "--prompt", "-r", "--role", "-t", "--type", "-R", "--chroot", "-T", "--command-timeout", "-U", "--other-user"]
flag_options = ["-A", "--askpass", "-b", "--background", "-B", "--bell", "-E", "--preserve-env", "-H", "--set-home", "-i", "--login", "-k", "--reset-timestamp", "-n", "--non-interactive", "-P", "--preserve-groups", "-S", "--stdin", "-s", "--shell"]
no_run_options = ["-l", "--list", "-v", "--validate", "-V", "--version", "-K", "--remove-timestamp"]
assignments = true

[[program]]
name = "command"
shells = ["bash"]
kind = ["wrapper"]
flag_options = ["-p"]
no_run_options = ["-v", "-V"]

[[program]]
name = "nohup"
shells = ["bash"]
kind = ["wrapper"]

# `exec [-cl] [-a name] [command [arguments]]` (bash's `help exec`); with no command it runs nothing.
[[program]]
name = "exec"
shells = ["bash"]
kind = ["wrapper"]
value_options = ["-a"]
flag_options = ["-c", "-l"]

# `builtin shell-builtin [arguments]` (bash's `help builtin`).
[[program]]
name = "builtin"
shells = ["bash"]
kind = ["wrapper"]

# --- Programs that turn `\\` into `\` themselves (bash-backslash-collapse) ---

[[program]]
name = "printf"
shells = ["bash"]
escapes = "always"
value_options = ["-v"]

[[program]]
name = "echo"
shells = ["bash"]
escapes = "option"
escape_options = ["-e"]

# --- Native Windows programs that take Linux paths, which Git Bash rewrites (bash-msys-path-mangle) ---

[[program]]
name = "docker"
shells = ["bash"]
kind = ["native-msys"]
fix = "prefix MSYS_NO_PATHCONV=1, or write the leading slash as //"
follow_when = ["-f", "--follow"]
follow_sub = "logs"
follow_fix = "timeout 60 <command>"

[[program]]
name = "docker-compose"
shells = ["bash"]
kind = ["native-msys"]
fix = "prefix MSYS_NO_PATHCONV=1, or write the leading slash as //"

[[program]]
name = "wsl"
shells = ["bash"]
kind = ["native-msys"]
fix = "prefix MSYS_NO_PATHCONV=1, or write the leading slash as //"

[[program]]
name = "kubectl"
shells = ["bash"]
kind = ["native-msys"]
fix = "prefix MSYS_NO_PATHCONV=1, or write the leading slash as //"
follow_when = ["-f", "--follow"]
follow_sub = "logs"
follow_fix = "timeout 60 <command>"

[[program]]
name = "podman"
shells = ["bash"]
kind = ["native-msys"]
fix = "prefix MSYS_NO_PATHCONV=1, or write the leading slash as //"

