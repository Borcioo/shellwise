# --- Builtins with a cmd.exe spelling that breaks in bash (bash-cd-slash-d) ---

[[program]]
name = "cd"
shells = ["bash"]
cmd_options = ["/d"]
fix = "cd <path>"

# --- Programs that wait (Task 33: will-hang, read by src/rules/hang.rs) ---
# hang_when       options that start the wait; empty = the program always waits
# hang_unless     options that end or bound the wait, read as getopt does (`-rt 5`, `-t5`, `--print`;
#                 a letter in value_options takes the rest of its cluster or the next word)
# hang_stdin      true = feeding stdin (redirect, here-string, pipe, loop) ends the wait
# hang_bash_only  true = checked in Bash only
# hang_level      "break" or "warn" (default warn)
# bounds_wait     true on a wrapper that bounds what it wraps (timeout)

[[program]]
name = "read"
shells = ["bash"]
kind = ["interactive"]
value_options = ["-a", "-d", "-i", "-n", "-N", "-p", "-t", "-u"]
hang_unless = ["-t", "-u"]
hang_stdin = true
hang_level = "break"
fix = 'set the variable directly (x=<value>) or feed read its input: read x <<< "<value>"'

[[program]]
name = "claude"
kind = ["interactive"]
hang_when = ["-p", "--print"]
hang_bash_only = true
hang_level = "warn"
fix = "timeout 120 claude -p <prompt>"
lint = { tags = ["claude-cli"], config_env = ["CLAUDE_CONFIG_DIR"], harmless = ["--version", "-v", "--help", "-h"] }

# --- The delete family (Task 32: [program.delete], read by src/rules/delete.rs) ---

[[program]]
name = "remove-item"
shells = ["pwsh"]
kind = ["delete"]
value_options = ["-Filter", "-Include", "-Exclude", "-Credential", "-Stream", "-ErrorAction", "-ea", "-WarningAction", "-wa", "-InformationAction", "-infa", "-ProgressAction", "-proga", "-ErrorVariable", "-ev", "-WarningVariable", "-wv", "-InformationVariable", "-iv", "-OutVariable", "-ov", "-OutBuffer", "-ob", "-PipelineVariable", "-pv"]
lint = { tags = ["children-delete"], flag_hints = ["-rf=-Recurse -Force", "-fr=-Recurse -Force", "-Rf=-Recurse -Force"] }
[program.delete]
recursive = ["-Recurse"]
forced = ["-Force"]
dry_run = ["-WhatIf"]
target_options = ["-Path", "-LiteralPath"]

[[program]]
name = "clear-content"
shells = ["pwsh"]
kind = ["delete"]
value_options = ["-Filter", "-Include", "-Exclude", "-Credential", "-Stream", "-ErrorAction", "-ea", "-WarningAction", "-wa", "-ErrorVariable", "-ev", "-OutVariable", "-ov"]
[program.delete]
dry_run = ["-WhatIf"]
target_options = ["-Path", "-LiteralPath"]

[[program]]
name = "rm"
kind = ["delete"]
[program.delete]
recursive = ["-r", "-R", "--recursive"]
forced = ["-f", "--force"]

[[program]]
name = "rmdir"
kind = ["delete"]
[program.delete]

[[program]]
name = "unlink"
kind = ["delete"]
[program.delete]

[[program]]
name = "shred"
kind = ["delete"]
[program.delete]

[[program]]
name = "find"
[program.delete]
targets = "leading"
contents = true
exec_options = ["-exec", "-execdir", "-ok", "-okdir"]
exec_ends = [";", "+"]

[[program]]
name = "xargs"
shells = ["bash"]
value_options = ["-I", "-n", "-P", "-d", "-L", "-s", "-E", "-a", "--max-args", "--max-procs", "--delimiter", "--arg-file", "--replace", "--max-lines", "--eof"]
[program.delete]
runner = true

[[program]]
name = "robocopy"
[program.delete]
targets = "second"
always_recursive = true
follows_links = true
slash_options = true
dry_run = ["/L"]

# --- Code the guard does not read: danger only with a raw destructive match (opaque-destructive) ---

[[program]]
name = "bash"
shells = ["bash"]
kind = ["shell"]

[[program]]
name = "sh"
kind = ["shell"]

[[program]]
name = "zsh"
kind = ["shell"]

[[program]]
name = "pwsh"
kind = ["shell"]
value_options = ["-ExecutionPolicy", "-ep", "-ex", "-WorkingDirectory", "-wd", "-OutputFormat", "-of", "-o", "-InputFormat", "-inf", "-if", "-ConfigurationName", "-config", "-SettingsFile", "-WindowStyle", "-w", "-CustomPipeName", "-EncodedCommand", "-e", "-ec", "-Version", "-v"]
lint = { script_flags = ["-File", "-f"], command_flags = ["-Command", "-c"] }

[[program]]
name = "powershell"
kind = ["shell"]
value_options = ["-ExecutionPolicy", "-ep", "-ex", "-OutputFormat", "-of", "-o", "-InputFormat", "-inf", "-if", "-ConfigurationName", "-config", "-WindowStyle", "-w", "-EncodedCommand", "-e", "-ec", "-Version", "-v", "-PSConsoleFile"]
lint = { script_flags = ["-File", "-f"], command_flags = ["-Command", "-c"] }

# cmd.exe: its whole command line is capped at 8191 characters (Task 31 reads line_limit).
[[program]]
name = "cmd"
kind = ["shell"]
line_limit = 8191
fix = "write the command to a file and lint it"

[[program]]
name = "eval"
shells = ["bash"]
kind = ["eval"]

[[program]]
name = "invoke-expression"
shells = ["pwsh"]
kind = ["eval"]

# --- git (Task 32: [program.discard], read by src/rules/git.rs). Subcommands use `words`, not
# `name`: tests/shape.rs reads every `name` key in the table as a program name. ---

[[program]]
name = "git"
lint = { tags = ["git-cli"], global_value_options = ["-C", "-c", "--git-dir", "--work-tree", "--namespace", "--super-prefix", "--config-env", "--exec-path", "--attr-source", "--shallow-file"], stdin_commit = ["commit"], file_long = ["--file"], file_short = ["F"] }
[program.discard]
global_value_options = ["-C", "-c", "--git-dir", "--work-tree", "--namespace", "--super-prefix", "--config-env", "--exec-path", "--attr-source", "--shallow-file"]
config_options = ["-c"]
hook_config_keys = ["core.hookspath"]
no_verify = "--no-verify"
verify = "--verify"
staged = ["--staged", "-S"]
worktree = ["--worktree", "-W"]
source_options = ["-s", "--source"]
hunk_options = ["--ours", "--theirs", "-p", "--patch", "-m", "--merge"]
branch_options = ["-b", "-B", "--orphan", "--detach", "-d"]
clean_value_options = ["-e", "--exclude"]
clean_dirs_options = ["-d"]
force_options = ["-f", "--force"]

[[program.discard.subcommands]]
words = "commit"
action = "hooks"
no_verify_short = "n"
value_shorts = "mFCct"
value_long = ["--message", "--file", "--reuse-message", "--reedit-message", "--fixup", "--squash", "--author", "--date", "--template", "--trailer", "--cleanup", "--pathspec-from-file"]

[[program.discard.subcommands]]
words = "push"
action = "hooks"
value_shorts = "o"
value_long = ["--repo", "--receive-pack", "--exec", "--push-option"]

[[program.discard.subcommands]]
words = "merge"
action = "hooks"
value_shorts = "mFsX"
value_long = ["--message", "--file", "--strategy-option", "--into-name", "--cleanup"]

[[program.discard.subcommands]]
words = "rebase"
action = "hooks"
value_shorts = "CxsX"
value_long = ["--onto", "--strategy-option", "--exec", "--whitespace", "--empty"]

[[program.discard.subcommands]]
words = "am"
action = "hooks"
no_verify_short = "n"
value_shorts = "Cp"
value_long = ["--directory", "--exclude", "--include", "--whitespace", "--patch-format", "--resolvemsg", "--quoted-cr", "--empty"]

[[program.discard.subcommands]]
words = "checkout"
action = "checkout-paths"

[[program.discard.subcommands]]
words = "restore"
action = "restore-paths"

[[program.discard.subcommands]]
words = "worktree remove"
action = "worktree-remove"

[[program.discard.subcommands]]
words = "reset"
action = "discard"
danger_options = ["--hard", "--merge"]

[[program.discard.subcommands]]
words = "switch"
action = "discard"

[[program.discard.subcommands]]
words = "stash drop"
action = "discard"
warn_only = true

[[program.discard.subcommands]]
words = "stash clear"
action = "discard"

[[program.discard.subcommands]]
words = "clean"
action = "clean"

# --- PowerShell lint (Task 30). Every rule fact sits in the row's `lint` table (`Program::extra`):
# `tags` says which rule reads the row; the other keys are that rule's lists. Cmdlet rows are
