# --- Builtins with a cmd.exe spelling that breaks in bash (bash-cd-slash-d) ---

[[program]]
name = "cd"
shells = ["bash"]
cmd_options = ["/d"]
fix = "cd <path>"

# --- Builtins whose `NAME=value` operand assigns like a plain `NAME=value` (src/fs/assigned.rs) ---

[[program]]
name = "export"
shells = ["bash"]
assigns_operand = true

# --- Programs that wait (Task 33: will-hang, read by src/rules/hang.rs) ---
# hang_when       options that start the wait; empty = the program always waits
# hang_unless     options that end or bound the wait, read as getopt does (`-rt 5`, `-t5`, `--print`;
#                 a letter in value_options takes the rest of its cluster or the next word)
# hang_stdin      true = feeding stdin (redirect, here-string, pipe, loop) ends the wait
# hang_bash_only  true = checked in Bash only
# hang_level      "break" or "warn" (default warn)
# bounds_wait     true on a wrapper that bounds what it wraps (timeout)

[[program]]
name = "read"
shells = ["bash"]
kind = ["interactive"]
value_options = ["-a", "-d", "-i", "-n", "-N", "-p", "-t", "-u"]
hang_unless = ["-t", "-u"]
hang_stdin = true
hang_level = "break"
fix = 'feed read its input on the same line: <command> <<< "<value>"'
loop_role = ["wait"]
loop_wait_when = ["-t"]
loop_reads_input = true

[[program]]
name = "claude"
kind = ["interactive"]
hang_when = ["-p", "--print"]
hang_bash_only = true
hang_level = "warn"
fix = "timeout 120 claude -p <prompt>"
lint = { tags = ["claude-cli"], config_env = ["CLAUDE_CONFIG_DIR"], harmless = ["--version", "-v", "--help", "-h"] }

# --- Wait loops (wait-loop-unbounded, read by src/rules/wait_loop.rs; the loop words are in [loops]) ---
# loop_role       what the command is to a loop: "wait" (it pauses, so the loop polls)
# loop_wait_when  for "wait": only with one of these options (`read -t`)
# loop_reads_input true = it reads its input (`read`): a loop whose condition runs it without its
#                 `loop_wait_when` option ends with its input and is no wait loop (Ruling 134); with
#                 it (`read -t`) its own wait ends the loop instead of pacing it
# loop_wait_ms    for "wait": with one of these options its number is milliseconds
# loop_wait_in_ms for "wait": its number is always milliseconds (`[Threading.Thread]::Sleep(500)`)
# loop_wait_units for "wait": the seconds of each unit suffix its number may carry (`sleep 1m`)
# loop_body       on a shell row: the option whose next word is a script the rule reads too
#                 (`bash -c '…'`), alone or in a cluster of short options (`-lc`)
# loop_skips_round true = it ends the round early (`continue`): a Bash Fix cannot end the round
#                 with its round test, so it is a sentence
# loop_join       a PowerShell operator that joins two tests of a loop's condition: "and" or "or"
#                 (Ruling 141 reads which side a bound must be on)
# A .NET method is a row named `[type]::method` as written, lowercase.

[[program]]
name = "continue"
shells = ["bash"]
loop_skips_round = true

[[program]]
name = "-and"
shells = ["pwsh"]
loop_join = "and"

[[program]]
name = "-or"
shells = ["pwsh"]
loop_join = "or"

[[program]]
name = "sleep"
shells = ["bash"]
loop_role = ["wait"]
loop_wait_units = { s = 1, m = 60, h = 3600, d = 86400 }

[[program]]
name = "[threading.thread]::sleep"
shells = ["pwsh"]
aliases = { pwsh_windows = ["[system.threading.thread]::sleep"], pwsh_posix = ["[system.threading.thread]::sleep"] }
loop_role = ["wait"]
loop_wait_in_ms = true

[[program]]
name = "start-sleep"
shells = ["pwsh"]
aliases = { pwsh_windows = ["sleep"], pwsh_posix = ["sleep"] }
loop_role = ["wait"]
loop_wait_ms = ["-Milliseconds", "-m"]

[[program]]
name = "wait-process"
shells = ["pwsh"]
loop_role = ["wait"]

[[program]]
name = "wait-job"
shells = ["pwsh"]
loop_role = ["wait"]
job_timeout_when = ["-Timeout"]

[[program]]
name = "wait-event"
shells = ["pwsh"]
loop_role = ["wait"]

# --- Follow commands (follow-unbounded, read by src/rules/wait_loop.rs) ---
# Only a time bound ends a follow (Ruling 137): `timeout`, or a job a `Wait-Job -Timeout` waits
# for. A later stage that waits for a line or a count (`| grep -m1`, `| head`, `| Select-Object
# -First`) ends it only if the line comes.
# follow            true = the command always follows its input (`watch`)
# follow_when       options that make it follow (`tail -f`)
# follow_sub        the subcommand the options count after (`kubectl logs -f`)
# follow_fix        the Fix: `<command>` is the follow command as typed, put back in its pipeline;
#                   `<pipeline>` is the whole pipeline; `<job>` a variable name the command never
#                   uses. The Fix is the whole command with each follow replaced in place
#                   (Ruling 148); where that cannot be built, a sentence (`follow_fix_sentence`, or
#                   one made from `follow_fix`)
# follow_job        true = a script block it runs is a job: a follow in it is bounded when the
#                   command also runs a `job_timeout_when` option of a job wait (`Wait-Job -Timeout`)
# The Get-Content row (PowerShell) carries `follow_when` and `follow_fix`.

[[program]]
name = "tail"
shells = ["bash"]
follow_when = ["-f", "-F", "--follow"]
follow_fix = "timeout 60 <command>"

[[program]]
name = "watch"
shells = ["bash"]
follow = true
follow_fix = "timeout 60 <command>"

[[program]]
name = "start-job"
shells = ["pwsh"]
follow_job = true

# --- The delete family (Task 32: [program.delete], read by src/rules/delete.rs) ---

[[program]]
name = "remove-item"
shells = ["pwsh"]
kind = ["delete"]
value_options = ["-Filter", "-Include", "-Exclude", "-Credential", "-Stream", "-ErrorAction", "-ea", "-WarningAction", "-wa", "-InformationAction", "-infa", "-ProgressAction", "-proga", "-ErrorVariable", "-ev", "-WarningVariable", "-wv", "-InformationVariable", "-iv", "-OutVariable", "-ov", "-OutBuffer", "-ob", "-PipelineVariable", "-pv"]
lint = { tags = ["children-delete"], flag_hints = ["-rf=-Recurse -Force", "-fr=-Recurse -Force", "-Rf=-Recurse -Force"] }
[program.delete]
recursive = ["-Recurse"]
forced = ["-Force"]
dry_run = ["-WhatIf"]
target_options = ["-Path", "-LiteralPath"]

[[program]]
name = "clear-content"
shells = ["pwsh"]
kind = ["delete"]
value_options = ["-Filter", "-Include", "-Exclude", "-Credential", "-Stream", "-ErrorAction", "-ea", "-WarningAction", "-wa", "-ErrorVariable", "-ev", "-OutVariable", "-ov"]
[program.delete]
dry_run = ["-WhatIf"]
target_options = ["-Path", "-LiteralPath"]

[[program]]
name = "rm"
kind = ["delete"]
[program.delete]
recursive = ["-r", "-R", "--recursive"]
forced = ["-f", "--force"]

[[program]]
name = "rmdir"
kind = ["delete"]
[program.delete]

[[program]]
name = "unlink"
kind = ["delete"]
[program.delete]

[[program]]
name = "shred"
kind = ["delete"]
[program.delete]

[[program]]
name = "find"
[program.delete]
targets = "leading"
contents = true
exec_options = ["-exec", "-execdir", "-ok", "-okdir"]
exec_ends = [";", "+"]

[[program]]
name = "xargs"
shells = ["bash"]
value_options = ["-I", "-n", "-P", "-d", "-L", "-s", "-E", "-a", "--max-args", "--max-procs", "--delimiter", "--arg-file", "--replace", "--max-lines", "--eof"]
[program.delete]
runner = true

[[program]]
name = "robocopy"
[program.delete]
targets = "second"
always_recursive = true
follows_links = true
slash_options = true
dry_run = ["/L"]

# --- Code the guard does not read: danger only with a raw destructive match (opaque-destructive) ---

[[program]]
name = "bash"
shells = ["bash"]
kind = ["shell"]
loop_body = ["-c"]

[[program]]
name = "sh"
kind = ["shell"]
loop_body = ["-c"]

[[program]]
name = "zsh"
kind = ["shell"]
loop_body = ["-c"]

[[program]]
name = "pwsh"
kind = ["shell"]
value_options = ["-ExecutionPolicy", "-ep", "-ex", "-WorkingDirectory", "-wd", "-OutputFormat", "-of", "-o", "-InputFormat", "-inf", "-if", "-ConfigurationName", "-config", "-SettingsFile", "-WindowStyle", "-w", "-CustomPipeName", "-EncodedCommand", "-e", "-ec", "-Version", "-v"]
lint = { script_flags = ["-File", "-f"], command_flags = ["-Command", "-c"] }

[[program]]
name = "powershell"
kind = ["shell"]
value_options = ["-ExecutionPolicy", "-ep", "-ex", "-OutputFormat", "-of", "-o", "-InputFormat", "-inf", "-if", "-ConfigurationName", "-config", "-WindowStyle", "-w", "-EncodedCommand", "-e", "-ec", "-Version", "-v", "-PSConsoleFile"]
lint = { script_flags = ["-File", "-f"], command_flags = ["-Command", "-c"] }

# cmd.exe: its whole command line is capped at 8191 characters (Task 31 reads line_limit). pwsh
# starts it as "C:\WINDOWS\system32\cmd.exe" (29 characters with the quotes) in place of the typed
# word: a typed `cmd /c echo …` of 8166 characters is refused (measured with pwsh 7.7).
[[program]]
name = "cmd"
kind = ["shell"]
line_limit = 8191
launch_path_units = 29
fix = "delete the leading cmd /c and run the program directly from PowerShell, which starts command lines up to 32766 characters"

[[program]]
name = "eval"
shells = ["bash"]
kind = ["eval"]

[[program]]
name = "invoke-expression"
shells = ["pwsh"]
kind = ["eval"]

# --- git (Task 32: [program.discard], read by src/rules/git.rs). Subcommands use `words`, not
# `name`: tests/shape.rs reads every `name` key in the table as a program name. ---

[[program]]
name = "git"
lint = { tags = ["git-cli"], global_value_options = ["-C", "-c", "--git-dir", "--work-tree", "--namespace", "--super-prefix", "--config-env", "--exec-path", "--attr-source", "--shallow-file"], stdin_commit = ["commit"], file_long = ["--file"], file_short = ["F"] }
[program.discard]
global_value_options = ["-C", "-c", "--git-dir", "--work-tree", "--namespace", "--super-prefix", "--config-env", "--exec-path", "--attr-source", "--shallow-file"]
config_options = ["-c"]
hook_config_keys = ["core.hookspath"]
no_verify = "--no-verify"
verify = "--verify"
staged = ["--staged", "-S"]
worktree = ["--worktree", "-W"]
source_options = ["-s", "--source"]
hunk_options = ["--ours", "--theirs", "-p", "--patch", "-m", "--merge"]
branch_options = ["-b", "-B", "--orphan", "--detach", "-d"]
clean_value_options = ["-e", "--exclude"]
clean_dirs_options = ["-d"]
force_options = ["-f", "--force"]

[[program.discard.subcommands]]
words = "commit"
action = "hooks"
no_verify_short = "n"
value_shorts = "mFCct"
value_long = ["--message", "--file", "--reuse-message", "--reedit-message", "--fixup", "--squash", "--author", "--date", "--template", "--trailer", "--cleanup", "--pathspec-from-file"]

[[program.discard.subcommands]]
words = "push"
action = "hooks"
value_shorts = "o"
value_long = ["--repo", "--receive-pack", "--exec", "--push-option"]

[[program.discard.subcommands]]
words = "merge"
action = "hooks"
value_shorts = "mFsX"
value_long = ["--message", "--file", "--strategy-option", "--into-name", "--cleanup"]

[[program.discard.subcommands]]
words = "rebase"
action = "hooks"
value_shorts = "CxsX"
value_long = ["--onto", "--strategy-option", "--exec", "--whitespace", "--empty"]

[[program.discard.subcommands]]
words = "am"
action = "hooks"
no_verify_short = "n"
value_shorts = "Cp"
value_long = ["--directory", "--exclude", "--include", "--whitespace", "--patch-format", "--resolvemsg", "--quoted-cr", "--empty"]

# `long_options`: every long option of the subcommand, from `git <sub> --git-completion-helper-all`
# (git 2.53), so a unique prefix (`--har`) reads as the option git takes it for.
[[program.discard.subcommands]]
