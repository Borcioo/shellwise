value_long = ["--orphan"]
long_options = ["--guess", "--overlay", "--quiet", "--recurse-submodules", "--progress", "--merge", "--conflict", "--detach", "--track", "--force", "--orphan", "--overwrite-ignore", "--ignore-other-worktrees", "--ours", "--theirs", "--patch", "--unified", "--inter-hunk-context", "--ignore-skip-worktree-bits", "--pathspec-from-file", "--pathspec-file-nul", "--no-guess", "--no-overlay", "--no-quiet", "--no-recurse-submodules", "--no-progress", "--no-merge", "--no-conflict", "--no-detach", "--no-track", "--no-force", "--no-orphan", "--no-overwrite-ignore", "--no-ignore-other-worktrees", "--no-patch", "--no-ignore-skip-worktree-bits", "--no-pathspec-from-file", "--no-pathspec-file-nul"]

[[program.discard.subcommands]]
words = "restore"
action = "restore-paths"
long_options = ["--source", "--staged", "--worktree", "--ignore-unmerged", "--overlay", "--quiet", "--recurse-submodules", "--progress", "--merge", "--conflict", "--ours", "--theirs", "--patch", "--unified", "--inter-hunk-context", "--ignore-skip-worktree-bits", "--pathspec-from-file", "--pathspec-file-nul", "--no-source", "--no-staged", "--no-worktree", "--no-ignore-unmerged", "--no-overlay", "--no-quiet", "--no-recurse-submodules", "--no-progress", "--no-merge", "--no-conflict", "--no-patch", "--no-ignore-skip-worktree-bits", "--no-pathspec-from-file", "--no-pathspec-file-nul"]

[[program.discard.subcommands]]
words = "worktree remove"
action = "worktree-remove"

[[program.discard.subcommands]]
words = "reset"
action = "discard"
danger_options = ["--hard", "--merge"]
long_options = ["--quiet", "--no-refresh", "--mixed", "--soft", "--hard", "--merge", "--keep", "--recurse-submodules", "--patch", "--unified", "--inter-hunk-context", "--intent-to-add", "--pathspec-from-file", "--pathspec-file-nul", "--stdin", "--refresh", "--no-quiet", "--no-recurse-submodules", "--no-patch", "--no-intent-to-add", "--no-pathspec-from-file", "--no-pathspec-file-nul", "--no-stdin"]

[[program.discard.subcommands]]
words = "switch"
action = "discard"
