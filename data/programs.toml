# --- PowerShell lint (Task 30). Every rule fact sits in the row's `lint` table (`Program::extra`):
# `tags` says which rule reads the row; the other keys are that rule's lists. Cmdlet rows are
# named by the cmdlet (lowercase): the rules look a command up by the cmdlet its alias resolves to.

[[program]]
name = "bash"
shells = ["pwsh"]
kind = ["shell"]
loop_body = ["-c"]
fix ="& \"$env:ProgramFiles\\Git\\bin\\bash.exe\""
lint = { tags = ["wsl-bash"] }

[[program]]
name = "wsl"
shells = ["pwsh"]
value_options = ["-d", "--distribution", "-u", "--user", "--cd"]
lint = { tags = ["wsl-launcher"], exec_flags = ["-e", "--exec"] }

[[program]]
name = "tee-object"
shells = ["pwsh"]
lint = { tags = ["tee-cmdlet"], variable_params = ["variable"] }

# `variable_params`: parameters that bind a variable by name (stale-write-var), named or at their
# position.
[[program]]
name = "set-variable"
shells = ["pwsh"]
lint = { variable_params = ["name"] }

[[program]]
name = "new-variable"
shells = ["pwsh"]
lint = { variable_params = ["name"] }

[[program]]
name = "invoke-restmethod"
shells = ["pwsh"]
lint = { variable_params = ["statuscodevariable", "responseheadersvariable", "sessionvariable"] }

[[program]]
name = "invoke-webrequest"
shells = ["pwsh"]
lint = { variable_params = ["sessionvariable"] }

[[program]]
name = "select-object"
shells = ["pwsh"]
lint = { tags = ["truncator"], truncate_params = ["first"], flag_hints = ["-n#=-First "] }

[[program]]
name = "get-content"
shells = ["pwsh"]
lint = { flag_hints = ["-n#=-TotalCount "] }
follow_when = ["-Wait"]
# The job starts where the caller is (Windows PowerShell 5.1 starts it in Documents) and reads the
# caller's variables through `$using:`, all but these, which the pipeline or the shell sets itself.
# Its output is text: Windows PowerShell 5.1 shows a received `Select-String` result blank.
follow_fix = "$<job> = Start-Job { Set-Location -LiteralPath $using:PWD; <pipeline> | Out-String -Stream -Width 4096 }; $null = Wait-Job $<job> -Timeout 60; Receive-Job $<job>; Remove-Job $<job> -Force"
follow_fix_locals = ["_", "PSItem", "true", "false", "null", "args", "input", "this", "matches", "foreach", "switch", "Error", "LASTEXITCODE", "ExecutionContext", "MyInvocation", "PSCmdlet", "PSBoundParameters", "PWD", "HOME", "PSHOME", "Host", "PID", "PSVersionTable", "IsWindows", "IsLinux", "IsMacOS", "IsCoreCLR"]
# Scopes the job reads as the caller does, and loop words that set the variable they name.
follow_fix_scopes = ["env", "using"]
follow_fix_sets = ["foreach"]
# The Fix where no command can be built (the rule adds why).
follow_fix_sentence = "run the pipeline in a job that `Wait-Job -Timeout 60` waits for, started in this folder (`Set-Location -LiteralPath $using:PWD`), given each variable it reads as `$using:<name>` and ended with `| Out-String -Stream -Width 4096`"

[[program]]
name = "set-content"
shells = ["pwsh"]
lint = { tags = ["file-writer"], content_position = ["1"] }

[[program]]
name = "out-file"
shells = ["pwsh"]
lint = { tags = ["file-writer"], append_params = ["append"] }

[[program]]
name = "get-childitem"
shells = ["pwsh"]
lint = { flag_hints = ["-la=-Force", "-al=-Force", "-lh=-Force", "-lah=-Force", "-alh=-Force", "-ltr=-Force"] }

[[program]]
name = "select-string"
shells = ["pwsh"]
lint = { flag_hints = ["-A#=-Context 0,"] }

[[program]]
name = "set-location"
shells = ["pwsh"]
lint = { flag_hints = ["/d=", "/D="] }

[[program]]
name = "gh"
shells = ["pwsh"]
lint = { tags = ["prose-cli"], prose_subcommands = ["pr", "issue", "release"], prose_flags = ["--body=--body-file", "-b=--body-file", "--notes=--notes-file", "-n=--notes-file", "--title", "-t"] }

[[program]]
name = "rg"
shells = ["pwsh"]
fix = "--files-without-match"
lint = { follow_flags = ["-L"] }

[[program]]
name = "stop-process"
shells = ["pwsh"]
lint = { tags = ["process-stop"], name_params = ["name"] }

[[program]]
name = "taskkill"
shells = ["pwsh"]
lint = { tags = ["process-stop"], name_flags = ["/IM"] }

[[program]]
name = "pkill"
shells = ["pwsh"]
lint = { tags = ["process-stop"], always = ["yes"] }

[[program]]
name = "killall"
shells = ["pwsh"]
lint = { tags = ["process-stop"], always = ["yes"] }

[[program]]
name = "python"
shells = ["pwsh"]
aliases = { pwsh_windows = ["python3", "py"], pwsh_posix = ["python3"] }
lint = { tags = ["interpreter"], stdin_args = ["-"] }

[[program]]
name = "node"
shells = ["pwsh"]
lint = { tags = ["interpreter"], stdin_args = ["-"] }

[[program]]
name = "php"
shells = ["pwsh"]
lint = { tags = ["interpreter"], stdin_args = ["-"] }

