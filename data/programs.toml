# --- The Git Bash path conversion (bash-msys-path-mangle) ---

[msys]
# A word Git Bash rewrites into a Windows path: `/<root>` or `/<root>/...`, alone or as the value
# of `--opt=` / `-o=`.
roots = ["var", "usr", "etc", "tmp", "home", "opt", "bin", "sbin", "app", "srv", "data", "root", "mnt", "run", "lib", "workspace", "code"]
# Environment names that turn the conversion off; the rule stays quiet when the command sets one.
opt_out = ["MSYS_NO_PATHCONV", "MSYS2_ARG_CONV_EXCL"]
