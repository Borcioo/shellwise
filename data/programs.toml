# --- The Git Bash path conversion (bash-msys-path-mangle) ---

[msys]
# A word Git Bash rewrites into a Windows path: `/<root>` or `/<root>/...`, alone or as the value
# of `--opt=` / `-o=`.
roots = ["var", "usr", "etc", "tmp", "home", "opt", "bin", "sbin", "app", "srv", "data", "root", "mnt", "run", "lib", "workspace", "code"]
# Environment names that turn the conversion off; the rule stays quiet when the command sets one.
opt_out = ["MSYS_NO_PATHCONV", "MSYS2_ARG_CONV_EXCL"]

# --- The words a loop's end is read from (wait-loop-unbounded) ---

[loops]
# Words that leave the loop or the shell.
exits = ["break", "exit", "return", "throw"]
# A whole loop condition that is always true (Bash `true`, `:`; PowerShell `$true`, `1`).
always = ["true", ":", "$true", "1"]
# Words that read the time: a comparison with one in an operand is a deadline (`$SECONDS`,
# `date +%s`, `Get-Date`, `[DateTime]::Now`, a `Stopwatch`'s `Elapsed`). Anywhere else (a message,
# a file name, a parameter such as `-Seconds`) a clock word is no bound.
clocks = ["SECONDS", "EPOCHSECONDS", "date", "Get-Date", "Now", "UtcNow", "Stopwatch", "Elapsed", "ElapsedMilliseconds", "ElapsedTicks"]
# Operators that compare numbers: a test with one on a variable the loop changes is a counter
# (`[ $n -lt 60 ]`, `(( n++ < 60 ))`, `$i -lt 60`).
compares = ["-lt", "-le", "-gt", "-ge", "-eq", "-ne", "<", "<=", ">", ">=", "==", "!="]
# The sentence after the Fix line.
# A tool call's shell never has the process as its child, so `wait <pid>` fails (127).
hint_bash = "when you wait for a process, wait on the process (timeout 600 tail --pid=<pid> -f /dev/null) rather than on a line in its log"
hint_pwsh = "when you wait for a process, wait on the process (Wait-Process -Id <pid> -Timeout <seconds>) rather than on a line in its log"
