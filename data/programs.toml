shells = ["bash"]
kind = ["launcher"]
fix = "call the php.exe of that version by its full path"

[[program]]
name = "php82"
shells = ["bash"]
kind = ["launcher"]
fix = "call the php.exe of that version by its full path"

[[program]]
name = "php83"
shells = ["bash"]
kind = ["launcher"]
fix = "call the php.exe of that version by its full path"

[[program]]
name = "php84"
shells = ["bash"]
kind = ["launcher"]
fix = "call the php.exe of that version by its full path"

[[program]]
name = "php85"
shells = ["bash"]
kind = ["launcher"]
