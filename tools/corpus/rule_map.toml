# baseline-guard rule id -> shellwise rule id, read by `shellwise bench` (compiled in; `--rule-map`
# replaces it).
#
# [map]               every baseline-guard id that baseline.jsonl (`installed`) or known.jsonl names; a
#                     missing one stops the bench. A known.jsonl row is checked only once its
#                     shellwise id is a landed rule (`rules::all()` or `rules::length_rules()`).
#                     The parity line counts a denied ok row when every rule that denies it maps
#                     from a rule baseline-guard's installed set also denies that row with.
# own_line_rules      the owner-requested behaviour change (Ruling 99 Q1), reported on its own line
#                     outside meter 1.
# [runs_on]           where the shellwise rule each baseline-guard id maps to can fire: tools (Bash,
#                     PowerShell) and OSes (Windows, Linux), with the gate it was read from. Every
#                     [map] key needs one. baseline.py's known slice expects a rule only where its
#                     entry says it fires; the bench fails on a mapped rule that fires outside its
#                     entry on a row baseline-guard denies with that id.
# Parity exceptions are a separate file (`--parity-exceptions`, the format of
# tests/cases/parity_exceptions.toml).

own_line_rules = ["inline-script-too-long"]

[map]
# Installed (check_installed), with their port task.
bash-backslash-collapse = "bash-backslash-collapse"   # Task 29, narrowed (Ruling 99 Q2)
bash-too-long = "too-long"                            # Task 25
bat-metachar = "bat-metachar"                         # Task 30
cli-inline-prose = "cli-inline-prose"                 # Task 30
gate-truncated-pipeline = "gate-truncated-pipeline"   # Task 30
git-no-verify = "git-no-verify"                       # Task 32
git-restore-discards = "git-restore-discards"         # Task 32
git-unreadable = "git-unreadable"                     # Task 32
git-worktree-junction = "git-worktree-junction"       # Task 32
ps-bad-parameter = "ps-bad-parameter"                 # Task 30
ps-bare-bash = "ps-bare-bash"                         # Task 30
ps-dotnet-relative-path = "ps-dotnet-relative-path"   # Task 30
ps-git-commit-stdin = "ps-git-commit-stdin"           # Task 30
ps-native-nonewline = "ps-native-nonewline"           # Task 30
stale-write-var = "stale-write-var"                   # Task 30
# Full set only (check), named by known.jsonl.
bash-msys-path-mangle = "bash-msys-path-mangle"       # Task 29
bash-powershell-syntax = "bash-ps-cmdlet"             # Task 29 merges it into bash-ps-cmdlet
bash-unterminated-quote = "parse-error"               # Task 22
bash-vendor-bin-shebang = "bash-vendor-bin-shebang"   # Task 29
bash-versioned-php = "bash-versioned-php"             # Task 29
ps-unix-command = "ps-unix-command"                   # Task 30

# One line of evidence per rule: the gate in the code.
[runs_on]
bash-backslash-collapse = { tools = ["Bash"], os = ["Windows"], why = "git_bash(ctx), src/rules/bash_lint.rs" }
bash-msys-path-mangle = { tools = ["Bash"], os = ["Windows"], why = "git_bash(ctx), bash_lint.rs" }
bash-powershell-syntax = { tools = ["Bash"], os = ["Windows"], why = "bash-ps-cmdlet: git_bash(ctx), bash_lint.rs" }
bash-versioned-php = { tools = ["Bash"], os = ["Windows"], why = "git_bash(ctx), bash_lint.rs" }
bash-vendor-bin-shebang = { tools = ["Bash"], os = ["Windows"], why = "git_bash(ctx), bash_lint.rs" }
bash-too-long = { tools = ["Bash"], os = ["Windows"], why = "too-long: Git Bash only, src/rules/length.rs" }
bash-unterminated-quote = { tools = ["Bash"], os = ["Windows", "Linux"], why = "parse-error: every shell and OS" }
bat-metachar = { tools = ["PowerShell"], os = ["Windows"], why = "is_pwsh and os == Windows, pwsh_lint/bat.rs" }
ps-bare-bash = { tools = ["PowerShell"], os = ["Windows"], why = "is_pwsh and os == Windows, pwsh_lint/ports.rs" }
cli-inline-prose = { tools = ["PowerShell"], os = ["Windows", "Linux"], why = "is_pwsh, ports.rs" }
gate-truncated-pipeline = { tools = ["PowerShell"], os = ["Windows", "Linux"], why = "is_pwsh, ports.rs (baseline-guard also flags Bash)" }
ps-git-commit-stdin = { tools = ["PowerShell"], os = ["Windows", "Linux"], why = "is_pwsh, ports.rs" }
ps-bad-parameter = { tools = ["PowerShell"], os = ["Windows", "Linux"], why = "Facts::for_shell (pwsh), ports.rs" }
ps-native-nonewline = { tools = ["PowerShell"], os = ["Windows", "Linux"], why = "Facts::for_shell (pwsh), ports.rs" }
ps-dotnet-relative-path = { tools = ["PowerShell"], os = ["Windows", "Linux"], why = "Facts::for_shell (pwsh), ports.rs" }
stale-write-var = { tools = ["PowerShell"], os = ["Windows", "Linux"], why = "Facts::for_shell (pwsh), ports.rs" }
ps-unix-command = { tools = ["PowerShell"], os = ["Windows", "Linux"], why = "is_pwsh, pwsh_lint/catalogue.rs" }
git-no-verify = { tools = ["Bash", "PowerShell"], os = ["Windows", "Linux"], why = "git itself: the same on every OS (Task 32)" }
git-restore-discards = { tools = ["Bash", "PowerShell"], os = ["Windows", "Linux"], why = "git itself (Task 32)" }
git-unreadable = { tools = ["Bash", "PowerShell"], os = ["Windows", "Linux"], why = "git itself (Task 32)" }
git-worktree-junction = { tools = ["Bash", "PowerShell"], os = ["Windows", "Linux"], why = "git.rs has no OS gate: it fires on Linux too (the bench saw a Linux row)" }